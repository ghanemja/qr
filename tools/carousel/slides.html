<!-- The "hold the dots and swipe" carousel: ten 4:5 slides where a torn sheet of paper rips open
     over QR Compass, a little more on every slide, so scrubbing the dots plays it like a flipbook.
     window.slide(n) draws slide n (1..10) on the canvas; render.cjs saves each one.
     The picture under the paper (bg.jpg) comes from bg.cjs: SHIFT=0,-260 DSF=1.5, t = 60.5. -->
<html><head><meta charset="utf-8"><title>loading</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Archivo:wdth,wght@62..125,800..900&display=swap">
<style>html, body { margin: 0; background: #111; } canvas { display: block; }</style>
</head><body><canvas id="c" width="1080" height="1350"></canvas>
<script>
const W = 1080, H = 1350, N = 10;
const BG = new URLSearchParams(location.search).get('bg') || '/tools/carousel/bg.jpg';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- seeded randomness and 1D fractal noise ----------
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function noise1(seed) {
  const r = rng(seed), v = Array.from({ length: 4096 }, r);
  const at = (x) => { const i = Math.floor(x), f = x - i, a = v[((i % 4096) + 4096) % 4096], b = v[(((i + 1) % 4096) + 4096) % 4096]; const u = f * f * (3 - 2 * f); return a + (b - a) * u; };
  return (x, oct = 5) => { let s = 0, amp = 1, fr = 1, n = 0; for (let o = 0; o < oct; o++) { s += (at(x * fr + o * 31.7) - 0.5) * amp; n += amp; amp *= 0.55; fr *= 2.1; } return s / n * 2; };
}

// ---------- paper ----------
function paperTexture(seed, tint = 0) {
  const c = document.createElement('canvas'); c.width = W + 400; c.height = H + 400;
  const g = c.getContext('2d'), r = rng(seed);
  g.fillStyle = `rgb(${228 + tint},${227 + tint},${223 + tint})`; g.fillRect(0, 0, c.width, c.height);
  // big soft blotches
  g.filter = 'blur(60px)';
  for (let i = 0; i < 70; i++) { const x = r() * c.width, y = r() * c.height, s = 80 + r() * 260; g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,.18)' : 'rgba(150,145,135,.07)'; g.beginPath(); g.arc(x, y, s, 0, 7); g.fill(); }
  g.filter = 'none';
  // grain
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const n = (r() + r() + r() - 1.5) * 9; p[i] += n; p[i + 1] += n; p[i + 2] += n - 0.5; }
  g.putImageData(d, 0, 0);
  // fibres and specks
  for (let i = 0; i < 260; i++) { const x = r() * c.width, y = r() * c.height, a = r() * 6.28, l = 3 + r() * 14; g.strokeStyle = `rgba(${r() < 0.7 ? '120,110,95' : '255,255,255'},${0.08 + r() * 0.16})`; g.lineWidth = 0.6 + r() * 0.8; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 1) * l * 0.5, y + Math.sin(a + 1) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  for (let i = 0; i < 180; i++) { g.fillStyle = `rgba(${r() < 0.5 ? '170,120,80' : '90,85,80'},${0.12 + r() * 0.3})`; g.beginPath(); g.arc(r() * c.width, r() * c.height, 0.5 + r() * 1.3, 0, 7); g.fill(); }
  return c;
}
const PAPER_TOP = paperTexture(11, 2), PAPER_BOT = paperTexture(23, -1);

// The tear: one jagged line across the sheet (both halves share it, as they were one sheet).
const tn = noise1(7), wn = noise1(19), jn = noise1(41);
const TEAR = [];
for (let x = -420; x <= W + 420; x += 4) {
  const base = 600 - (x - 540) * 0.07;              // a gentle diagonal, lower on the left
  const y = base + tn(x / 230, 6) * 78 + jn(x / 11, 2) * 7;
  TEAR.push([x, y, 3 + Math.max(0, wn(x / 70, 4) + 0.35) * 16]); // [x, y, white rim width]
}

// One half of the sheet. side = -1 for the top half (paper above the tear), +1 for the bottom half.
function drawSheet(side, tf, tex) {
  const far = side < 0 ? -2000 : H + 2000;
  const outer = new Path2D(), inner = new Path2D();
  outer.moveTo(TEAR[0][0], far); inner.moveTo(TEAR[0][0], far);
  for (const [x, y, w] of TEAR) { outer.lineTo(x, y); inner.lineTo(x, y + side * w); }
  outer.lineTo(TEAR[TEAR.length - 1][0], far); inner.lineTo(TEAR[TEAR.length - 1][0], far);
  outer.closePath(); inner.closePath();
  ctx.save();
  ctx.translate(tf.x + tf.px, tf.y + tf.py); ctx.rotate(tf.r); ctx.translate(-tf.px, -tf.py);
  // the lifted paper's shadow on the picture
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = -side * 10; ctx.fillStyle = '#f4f3ef'; ctx.fill(outer); ctx.restore();
  // the torn white core, with loose fibres poking out
  ctx.save(); ctx.clip(outer); ctx.fillStyle = '#f6f5f1'; ctx.fillRect(-600, -2200, W + 1200, H + 4400);
  ctx.globalAlpha = 0.5; ctx.drawImage(tex, -200, -200); ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(-600, -2200, W + 1200, H + 4400); ctx.restore();
  const r = rng(side < 0 ? 5 : 9);
  ctx.strokeStyle = 'rgba(250,249,245,.85)'; ctx.lineCap = 'round';
  for (let i = 0; i < TEAR.length; i += 2) {
    if (r() < 0.55) continue; const [x, y] = TEAR[i], l = 2 + r() * 9, a = (side < 0 ? Math.PI / 2 : -Math.PI / 2) + (r() - 0.5) * 1.6;
    ctx.lineWidth = 0.5 + r() * 1.1; ctx.beginPath(); ctx.moveTo(x, y + side * 2); ctx.lineTo(x + Math.cos(a) * l, y + side * 2 + Math.sin(a) * l); ctx.stroke();
  }
  // the printed paper surface
  ctx.save(); ctx.clip(inner); ctx.drawImage(tex, -200, -200);
  // a soft shade where the sheet curls up at the tear
  const sh = ctx.createLinearGradient(0, 600 + side * 10, 0, 600 + side * 160); sh.addColorStop(0, 'rgba(90,80,70,.10)'); sh.addColorStop(1, 'rgba(90,80,70,0)');
  ctx.fillStyle = sh; ctx.fillRect(-600, -2200, W + 1200, H + 4400);
  ctx.restore();
  ctx.restore();
}

// ---------- the picture under the paper ----------
let bgImg;
// The story, one beat per slide: the hook (2–4 repeat it while the rip opens), what it is, that it
// moves, that it's yours, the asset store, and the ask.
const STORY = [
  ['I BUILT THE ECONOMY', 'in 3D.'],
  ['I BUILT THE ECONOMY', 'in 3D.'],
  ['I BUILT THE ECONOMY', 'in 3D.'],
  ['I BUILT THE ECONOMY', 'in 3D.'],
  ['581 COMPANIES', 'each its own world.'],
  ['261 MODELS', 'and every one moves.'],
  ['NOW THEY\u2019RE', 'all yours.'],
  ['FREE \u00b7 MIT \u00b7 GLB', 'download & use them.'],
  ['ANIMATED 3D MODEL', 'asset store'],
  ['COMMENT', 'for the link!'],
];
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function hidden(n) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.drawImage(bgImg, 0, 0, W, H);
  // the viewfinder: a dark glass panel over the city, like a phone camera about to scan
  const P = { x: 150, y: 415, w: 780, h: 400 };
  g.save(); rr(g, P.x, P.y, P.w, P.h, 34); g.clip(); g.filter = 'blur(14px)'; g.drawImage(bgImg, 0, 0, W, H); g.filter = 'none';
  const pg = g.createLinearGradient(0, P.y, 0, P.y + P.h); pg.addColorStop(0, 'rgba(12,18,28,.80)'); pg.addColorStop(1, 'rgba(12,18,28,.70)'); g.fillStyle = pg; g.fillRect(P.x, P.y, P.w, P.h); g.restore();
  g.save(); rr(g, P.x, P.y, P.w, P.h, 34); g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 2; g.stroke(); g.restore();
  // scan-frame corners
  g.strokeStyle = '#fff'; g.lineWidth = 7; g.lineCap = 'round'; const k = 52, m = 30;
  for (const [cx, cy, sx, sy] of [[P.x + m, P.y + m, 1, 1], [P.x + P.w - m, P.y + m, -1, 1], [P.x + m, P.y + P.h - m, 1, -1], [P.x + P.w - m, P.y + P.h - m, -1, -1]]) {
    g.beginPath(); g.moveTo(cx, cy + sy * k); g.lineTo(cx, cy + sy * 10); g.quadraticCurveTo(cx, cy, cx + sx * 10, cy); g.lineTo(cx + sx * k, cy); g.stroke();
  }
  // two lines: heavy condensed caps over a glowing italic serif
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  const glow = (fn) => { g.save(); g.shadowColor = 'rgba(255,255,255,.75)'; g.shadowBlur = 34; fn(); g.shadowBlur = 12; fn(); g.restore(); fn(); };
  const [top, sub] = STORY[n - 1];
  let size = 120; g.font = `900 ${size}px Archivo`; g.fontStretch = 'extra-condensed';
  while (g.measureText(top).width > P.w - 140) { size -= 2; g.font = `900 ${size}px Archivo`; g.fontStretch = 'extra-condensed'; }
  glow(() => g.fillText(top, W / 2, P.y + 160));
  g.fontStretch = 'normal'; let ss = 150; g.font = `italic ${ss}px "Instrument Serif"`;
  while (g.measureText(sub).width > P.w - 110) { ss -= 2; g.font = `italic ${ss}px "Instrument Serif"`; }
  glow(() => g.fillText(sub, W / 2, P.y + 272));
  return c;
}

// ---------- slide 1's hint ----------
function hint() {
  ctx.save();
  const x = 270, y = 1020, w = 540, h = 96;
  ctx.shadowColor = 'rgba(0,0,0,.12)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  rr(ctx, x, y, w, h, 30); ctx.fillStyle = '#4c6566'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '400 38px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Hold the dots and swipe!', W / 2, y + h / 2 + 1);
  // a hand-drawn arrow
  ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(541, 1140); ctx.bezierCurveTo(543, 1180, 538, 1215, 540, 1262); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(519, 1236); ctx.quadraticCurveTo(532, 1250, 540, 1264); ctx.quadraticCurveTo(549, 1248, 562, 1235); ctx.stroke();
  ctx.restore();
}

// ---------- the ten slides ----------
// Each half: offset (x, y) and turn r about a pivot (px, py). The sheet opens, then is pulled away.
const OPEN = [
  /* 1 */ { t: { x: 0, y: -16, r: -0.004, px: 1080, py: 600 }, b: { x: 0, y: 20, r: 0.006, px: 1080, py: 600 } },
  /* 2 */ { t: { x: 0, y: -40, r: -0.012, px: 1080, py: 600 }, b: { x: 0, y: 46, r: 0.014, px: 1080, py: 600 } },
  /* 3 */ { t: { x: 0, y: -95, r: -0.03, px: 1180, py: 600 }, b: { x: 0, y: 100, r: 0.03, px: 1180, py: 600 } },
  /* 4 */ { t: { x: -10, y: -165, r: -0.05, px: 1250, py: 600 }, b: { x: 0, y: 170, r: 0.045, px: 1250, py: 600 } },
  /* 5 */ { t: { x: -20, y: -250, r: -0.07, px: 1300, py: 600 }, b: { x: 10, y: 250, r: 0.06, px: 1300, py: 600 } },
  /* 6 */ { t: { x: -40, y: -350, r: -0.10, px: 1300, py: 600 }, b: { x: 20, y: 345, r: 0.085, px: 1300, py: 600 } },
  /* 7 */ { t: { x: -90, y: -480, r: -0.16, px: 1300, py: 600 }, b: { x: 40, y: 470, r: 0.13, px: 1300, py: 600 } },
  /* 8 */ { t: { x: -260, y: -700, r: -0.30, px: 1300, py: 600 }, b: { x: 80, y: 640, r: 0.22, px: 1300, py: 600 } },
  /* 9 */ { t: { x: -700, y: -1100, r: -0.55, px: 1300, py: 600 }, b: { x: -360, y: 980, r: 0.42, px: 1300, py: 600 } },
  /* 10 */ null,
];
window.slide = (n) => {
  const z = 1 + (n - 1) * 0.012, h = hidden(n);  // the picture creeps closer as it opens
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(h, (W - W * z) / 2, (H - H * z) / 2 - (n - 1) * 3, W * z, H * z);
  const o = OPEN[n - 1];
  if (o) { drawSheet(+1, o.b, PAPER_BOT); drawSheet(-1, o.t, PAPER_TOP); }
  if (n === 1) hint();
};
(async () => {
  bgImg = new Image(); bgImg.src = BG; await bgImg.decode();
  await Promise.all(['900 condensed 112px Archivo', '900 112px Archivo', 'italic 150px "Instrument Serif"', '400 38px Inter'].map((f) => document.fonts.load(f)));
  window.slide(1); document.title = 'ready';
})();
</script></body></html>
