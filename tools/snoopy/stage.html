    if (m.userData.vis) { m.position.copy(birdPos(4.45)).addScaledVector(m.userData.dir, 0.1 + 0.4 * pt); m.scale.setScalar(1.2 * (1 - pt) + 0.3); m.material.opacity = 1 - pt; }
  }
  // camera: flat and frontal for the 2D parts, swings round to show the depth in 3D
  const u = ioc((t - 4.7) / 1.4) * (1 - ioc((t - 8.4) / 1.8));
  const tf = V(0.05, 1.85, 0), pf = V(0.05, 1.85, 13.2);
  const th = 0.62 + 0.16 * Math.sin((t - 4.7) * 0.55), to = V(-0.45, 1.3, 0), po = to.clone().add(V(7.6 * Math.sin(th), 1.25, 7.6 * Math.cos(th)));
  cam.position.lerpVectors(pf, po, u); cam.fov = lerp(22, 31, u); cam.updateProjectionMatrix();
  cam.lookAt(tf.lerp(to, u));
}
function setPass(p) {
  scene.traverse((o) => {
    if (o.isMesh && o.userData.m3) o.material = p === 2 ? o.userData.m2 : o.userData.m3;
    if (o.userData.ol) o.visible = p === 2;
    if (o.userData.only3d) o.visible = p === 3 && o.userData.vis !== false;
    if (o.userData.only2d) o.visible = p === 2;
  });
}

// ---------- the wipe: 3D grows out of the switch, inside a ring of rainbow ----------
const wipeR = (t) => (t < 10.97 ? 1.05 * ioc((t - 3.98) / 0.75) : 1.05 * (1 - ioc((t - 10.98) / 0.5)));
const comp = new THREE.ShaderMaterial({
  uniforms: { t2: { value: RT2.texture }, t3: { value: RT3.texture }, c: { value: new THREE.Vector2() }, r: { value: 0 }, asp: { value: W / H }, seed: { value: 0 }, tm: { value: 0 }, res: { value: new THREE.Vector2(W, H) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `uniform sampler2D t2, t3; uniform vec2 c, res; uniform float r, asp, seed, tm; varying vec2 vUv;
  float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
  float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+1.),f.x), f.y); }
  vec3 aces(vec3 x){ vec3 a = clamp(x,0.,.82); vec3 b = max(x-.82,0.); return a + .18*(1.-exp(-b/.18)); }
  vec3 srgb(vec3 c){ return mix(c*12.92, 1.055*pow(c, vec3(1./2.4))-.055, step(.0031308,c)); }
  void main(){
    vec2 q = vUv*vec2(asp,1.);
    vec2 p = (vUv - c)*vec2(asp,1.); float d = length(p);
    float e = d + (n2(normalize(p+1e-5)*3. + tm*1.7) - .5)*.07;
    float m3 = r <= 0. ? 0. : (r >= 1.04 ? 1. : 1. - smoothstep(r-.004, r+.004, e));
    vec2 boil = (vec2(n2(q*7.+seed*13.1), n2(q*7.+seed*7.7+31.)) - .5)*.0028;
    vec3 c2 = srgb(texture2D(t2, vUv + boil).rgb);
    float lum = dot(c2, vec3(.299,.587,.114));
    lum *= .955 + .045*h(floor(vUv*res*.5) + seed);
    lum *= 1. - .1*pow(length(vUv-.5)*1.3, 3.);
    c2 = vec3(lum)*vec3(1.,.99,.965);
    vec3 c3 = srgb(aces(texture2D(t3, vUv).rgb*0.92));
    c3 = clamp(mix(vec3(dot(c3, vec3(.299,.587,.114))), c3, 1.18), 0., 1.);
    vec3 col = mix(c2, c3, m3);
    float ring = (r > 0. && r < 1.04) ? exp(-pow((e-r)/.011, 2.)) : 0.;
    float a = atan(p.y, p.x);
    vec3 rc = .55 + .45*cos(a + tm*4. + vec3(0., 2.1, 4.2));
    col = mix(col, rc + .25, ring*.9);
    gl_FragColor = vec4(col, 1.);
  }`,
  depthTest: false, depthWrite: false,
});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), comp); quad.frustumCulled = false;
const qScene = new THREE.Scene(); qScene.add(quad); const qCam = new THREE.Camera();

window.frame = (t) => {
  const r = wipeR(t);
  if (r < 1.04) { pose(Math.floor(t * 12 + 1e-6) / 12, true); setPass(2); R.shadowMap.enabled = false; R.setRenderTarget(RT2); R.render(scene, cam); }
  pose(t, false);
  if (r > 0) { setPass(3); R.shadowMap.enabled = true; R.setRenderTarget(RT3); R.render(scene, cam); }
  const kp = TOG.localToWorld(knob.position.clone()).project(cam);
  comp.uniforms.c.value.set(kp.x * 0.5 + 0.5, kp.y * 0.5 + 0.5);
  comp.uniforms.r.value = r; comp.uniforms.tm.value = t; comp.uniforms.seed.value = Math.floor(t * 8);
  R.setRenderTarget(null); R.render(qScene, qCam);
};
window.frame(0);
document.title = 'ready';
</script></body></html>
