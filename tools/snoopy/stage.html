for (const [a, l] of [[-0.35, 0.09], [0, 0.11], [0.35, 0.08]]) part(BB, cap(0.012, l), INK, ORA, V(0.04 + Math.sin(a) * 0.05, 0.34, 0), { rot: [0, 0, a - 0.2], ol: 0 });
for (const s of [-1, 1]) {
  part(BB, ell(0.012, 0.03, 0.012, 12), INK, NOSE, V(0.13, 0.22, 0.075 * s), { rot: [0, 0, -0.4], ol: 0 });
  part(BB, cap(0.01, 0.07), INK, ORA, V(0.0, -0.18, 0.05 * s), { ol: 0 });
}
part(BB, new THREE.SphereGeometry(0.25, 32, 20), PAPER, glass, V(0.06, 0.19, 0), { ol: 0, only: '3d', cast: false, order: 6 });
const wings = [-1, 1].map((s) => {
  const g = new THREE.Group(); g.position.set(-0.01, 0.04, 0.1 * s); g.userData.s = s; BB.add(g);
  part(g, ell(0.08, 0.022, 0.15), PAPER, YEL, V(-0.02, 0, 0.13 * s), { ol: 0.007 }); return g;
});

// ---------- the toggle: placed where the paw is at the top of the big jump ----------
const TOG = new THREE.Group(); scene.add(TOG);
const PILL_OFF = new THREE.Color('#d1d1d6'), PILL_ON = new THREE.Color('#34c759');
const pillM = std('#d1d1d6', 0.35);
const pill = part(TOG, cap(0.33, 0.66).rotateZ(Math.PI / 2).scale(1, 1, 0.3), new THREE.MeshBasicMaterial({ color: PAPER }), pillM, V(0.33, 0, 0), { ol: 0.013 });
const knob = part(TOG, new THREE.SphereGeometry(0.29, 32, 24).scale(1, 1, 0.45), PAPER, std('#ffffff', 0.3), V(0, 0, 0.09), { ol: 0.012 });

// ---------- confetti and the puff the bird pops out of (3D only) ----------
const NC = 110, conf = new THREE.InstancedMesh(new THREE.BoxGeometry(0.075, 0.005, 0.045), std('#ffffff', 0.5, { side: THREE.DoubleSide }), NC);
conf.userData.only3d = true; scene.add(conf);
const PAL = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93', '#ff8fab', '#ffffff'].map((c) => new THREE.Color(c));
const confData = [...Array(NC)].map((_, i) => {
  conf.setColorAt(i, PAL[i % PAL.length]);
  return { v: V(-2.2 + rnd() * 4.4, -1.5 + rnd() * 3.5, 0.3 + rnd() * 2.4), r: V(rnd() * 6, rnd() * 6, rnd() * 6), w: V(rnd() * 10 - 5, rnd() * 10 - 5, rnd() * 10 - 5), d: rnd() * 0.12 };
});
const puffs = [...Array(8)].map((_, i) => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 12), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true }));
  m.userData.only3d = true; m.userData.dir = V(Math.cos(i / 8 * TAU), Math.sin(i / 8 * TAU), 0.4 * Math.sin(i * 2.3)); scene.add(m); return m;
});

// ---------- the choreography (timed to the song of the original reel: silent 1.9–4 s, drops at 4.3 s) ----------
const DUR = 9.6, TAP = 4.3, HOUSE_Z = -0.05;
const XS = -2.9, XT = -0.4, ZW = 1.3;               // walk in along z = ZW, in front of the house, to x = XT
const roofY = (z) => RIDGE - SLOPE * Math.abs(z);
function walkCycle(P, d, amp, rate = 0.7) {
  const ph = TAU * d / rate, s = Math.sin(ph);
  P.legL = 0.55 * s * amp; P.legR = -P.legL;
  P.armLz = 0.12 - 0.4 * s * amp; P.armRz = 0.12 + 0.4 * s * amp;
  P.bob = 0.045 * amp * Math.cos(2 * ph); P.headZ += 0.05 * Math.sin(2 * ph) * amp;
  P.ear = 0.15 * Math.sin(2 * ph - 1) * amp; P.lean = -0.06 * amp;
}
function snoopy(t) {
  const P = { x: XT, y: 0, z: ZW, ry: 0, lean: 0, roll: 0, sq: 1, headZ: 0, headX: 0, headY: 0, armLz: 0.12, armLx: 0, armRz: 0.12, armRx: 0, armRs: 1, legL: 0, legR: 0, ear: 0, bob: 0, earUp: 0.1 };
  // walk in (constant pace, easing to a stop at 1.9 s)
  if (t < 1.95) {
    const a = 0.7, v = 2 / (1 + a), u = clamp(t / 1.9);
    const s = u < a ? v * u : v * a + v * (u - a) - v * (u - a) ** 2 / (2 * (1 - a));
    P.x = XS + (XT - XS) * s; walkCycle(P, P.x - XS, t < 1.9 ? (u < a ? 1 : 1 - (u - a) / (1 - a)) : 0);
  }
  // face the house, look up
  P.ry = Math.PI / 2 * ss(1.9, 2.15, t);
  P.headZ += 0.45 * ss(1.95, 2.2, t) * (1 - ss(2.38, 2.5, t));
  // jump and grab the edge of the roof (on the click at 2.65 s), dangle and kick
  const zg = EAVE_Z + 0.19, yg = EAVE + 0.02 - 1.22;
  if (t >= 2.3 && t < 2.65) { const p = (t - 2.3) / 0.35; P.z = lerp(ZW, zg, p); P.y = lerp(0, yg, p) + 0.25 * Math.sin(Math.PI * p); }
  const up = ss(2.3, 2.5, t) * (1 - ss(3.32, 3.45, t));
  P.armLz = lerp(P.armLz, 2.75, up); P.armRz = lerp(P.armRz, 2.75, up);
  P.sq -= 0.1 * hump(2.2, 2.32, t);
  P.headZ += 0.8 * ss(2.35, 2.55, t) * (1 - ss(3.3, 3.45, t)); // nose up the roof, not into it
  if (t >= 2.65 && t < 3.0) {
    P.z = zg; P.y = yg + 0.02 * Math.sin(TAU * 5 * t);
    const k = Math.sin(TAU * 7 * (t - 2.65)); P.legL = 0.7 * k; P.legR = -0.7 * k; P.lean = 0.06 * Math.sin(TAU * 3 * t);
    P.earUp += 0.25 + 0.15 * k;
  }
  // scramble over the edge and up the roof to the ridge
  if (t >= 3.0 && t < 3.4) {
    const q = ss(0, 1, (t - 3.0) / 0.4);
    if (q < 0.35) { P.z = lerp(zg, EAVE_Z, q / 0.35); P.y = lerp(yg, EAVE, q / 0.35); }
    else { P.z = lerp(EAVE_Z, 0, (q - 0.35) / 0.65); P.y = roofY(P.z); }
    const k = Math.sin(TAU * 9 * (t - 3.0)); P.legL = 0.9 * k; P.legR = -0.9 * k; P.armLz += 0.5 * k; P.armRz -= 0.5 * k;
    P.lean = -0.55 * hump(2.95, 3.45, t);
  }
  if (t >= 3.4) { P.z = 0; P.y = RIDGE; }
  // on the ridge: tiptoe, stretch… still short
  const tip = ss(3.45, 3.56, t) * (1 - ss(3.66, 3.74, t));
  P.y += 0.07 * tip; P.sq += 0.08 * tip; P.armRs += 0.5 * tip; P.armRx = -2.5 * tip + 0.08 * Math.sin(TAU * 7 * t) * tip;
  P.headZ += 0.5 * ss(3.4, 3.5, t) * (1 - ss(4.6, 4.9, t));
  // crouch, and the big jump: paw on the switch at the top (4.3 s, the drop)
  P.sq -= 0.22 * ss(3.72, 3.92, t) * (1 - ss(3.92, 3.99, t));
  P.armLz += 0.9 * ss(3.72, 3.9, t) * (1 - ss(3.9, 4.0, t)); P.armRz += 0.9 * ss(3.72, 3.9, t) * (1 - ss(3.9, 4.0, t));
  if (t > 3.95 && t < 4.65) { const p = (t - 3.95) / 0.7; P.y = RIDGE + 1.0 * 4 * p * (1 - p); P.legL = P.legR = -0.3 * Math.sin(Math.PI * p); }
  P.sq += 0.12 * ss(3.95, 4.02, t) * (1 - ss(4.05, 4.3, t)) - 0.16 * hump(4.6, 4.85, t);
  const reach = ss(3.97, 4.22, t) * (1 - ss(4.42, 4.75, t));
  P.armRx = lerp(P.armRx, -2.5, reach); P.armRs += 0.4 * reach;
  P.earUp += 0.25 * hump(3.95, 4.75, t);
  // sit on the ridge facing along it, and fly (and, in 2D at the end, just sit there and sigh)
  const sit = ss(4.75, 5.05, t);
  if (sit > 0) {
    P.ry = lerp(P.ry, 0, sit); P.y = lerp(P.y, RIDGE - 0.22, sit); P.x = lerp(XT, XT - 0.1, sit);
    P.legL = lerp(P.legL, 1.45, sit); P.legR = lerp(P.legR, 1.45, sit); P.lean = lerp(P.lean, 0.12, sit);
    P.armLz = lerp(P.armLz, 1.1, sit); P.armRz = lerp(P.armRz, 1.1, sit);
    const fly = ss(5.0, 5.4, t) * (1 - ss(8.3, 8.6, t));
    P.headZ += 0.18 * fly + 0.05 * Math.sin(TAU * t / 1.6) * fly; P.armLz += 0.15 * Math.sin(TAU * t) * fly; P.armRz -= 0.15 * Math.sin(TAU * t) * fly;
    P.sq -= 0.05 * ss(8.9, 9.3, t); P.headZ -= 0.28 * ss(8.9, 9.3, t); P.lean += 0.05 * ss(8.9, 9.3, t); // sigh
  }
  return P;
}
function applySnoopy(P) {
  S.position.set(P.x, P.y, P.z); S.rotation.y = P.ry;
  SB.scale.set(1 / Math.sqrt(P.sq), P.sq, 1 / Math.sqrt(P.sq)); SB.position.y = P.bob; SB.rotation.set(P.roll, 0, P.lean);
  legL.rotation.z = P.legL; legR.rotation.z = P.legR;
  armL.rotation.set(P.armLx, 0, P.armLz, 'XZY'); armR.rotation.set(P.armRx, 0, P.armRz, 'XZY');
  armR.scale.set(1, P.armRs, 1); armR.userData.end.scale.set(1, 1 / P.armRs, 1);
  HG.rotation.set(P.headX, P.headY, P.headZ, 'YXZ');
  for (const e of ears) e.rotation.set(-e.userData.s * P.earUp, 0, P.ear - 0.05);
  dash.userData.vis = P.y < 0.3; dash.scale.setScalar(1 - clamp(P.y / 0.3)); dash.position.y = 0.004 - P.y;
}
function house(t) {
  const lift = ss(4.95, 5.7, t) * (1 - ss(7.5, 8.35, t));
  HOUSE.position.set(0.25 * lift * Math.sin(t * 1.1), lift * (1.0 + 0.16 * Math.sin(TAU * t / 1.5)), HOUSE_Z);
  HOUSE.rotation.set(0.07 * lift * Math.sin(t * 1.9), 0.22 * lift * Math.sin(t * 0.8), lift * (0.07 + 0.05 * Math.sin(t * 2.3)));
  return lift;
}
// knob position: where the right paw is at the top of the big jump
house(TAP); applySnoopy(snoopy(TAP)); scene.updateMatrixWorld(true);
const KNOB0 = armR.userData.end.getWorldPosition(V()); KNOB0.x += 0.05; KNOB0.y += 0.06; KNOB0.z = -0.92;
TOG.position.copy(KNOB0);
const KNOB_ON = V(KNOB0.x + 0.66, KNOB0.y, -0.75);
const toggleOn = (t) => ss(TAP, TAP + 0.12, t) - ss(8.5, 8.6, t);

const housePt = (t, p) => { house(t); HOUSE.updateMatrixWorld(true); return HOUSE.localToWorld(p.clone()); };
function birdPos(t) {
  const c = housePt(Math.min(t, 8.6), V(XT, RIDGE + 1.1, 0));
  const a = TAU * (t - 4.6) / 2.2 - 0.6;
  const orbit = V(c.x + 1.35 * Math.cos(a), c.y + 0.35 * Math.sin(2 * a), c.z + 1.35 * Math.sin(a));
  let p = KNOB_ON.clone().add(V(0, 0.15, 0.25)).lerp(orbit, ss(4.6, 5.4, t));
  const perch = KNOB_ON.clone().add(V(-0.02, 0.33, 0.12));
  p.lerp(perch, ss(7.6, 8.32, t));
  if (t > 8.36 && t < 8.62) p.add(V(-0.06, -0.08, -0.06).multiplyScalar(Math.sin(clamp((t - 8.38) / 0.22) * Math.PI)));
  const mid = V((perch.x + XT + 0.75) / 2, RIDGE + 1.0, 0.2), land = V(XT + 0.75, RIDGE + 0.25, HOUSE_Z);
  const k = ss(8.66, 9.35, t); if (k > 0) { const a1 = perch.clone().lerp(mid, k), a2 = mid.clone().lerp(land, k); p = a1.lerp(a2, k); }
  return p;
}
function bird(t) {
  B.visible = t > 4.6;
  const g = clamp((t - 4.6) / 0.35); B.scale.setScalar(g < 1 ? g * (1 + 0.35 * Math.sin(g * Math.PI)) : 1);
  const p = birdPos(t), q = birdPos(t + 0.03), d = q.clone().sub(p);
  B.position.copy(p);
  const perch = ss(8.12, 8.32, t) * (1 - ss(8.62, 8.72, t)), landed = ss(9.3, 9.4, t);
  let yaw = lerp(Math.atan2(-d.z, d.x), Math.PI / 2 + 0.3, perch);
  if (t > 9.3) yaw = lerp(yaw, Math.PI - 0.5, landed);
  B.rotation.set(0, yaw, clamp(d.y * 6, -0.5, 0.5) * (1 - perch) * (1 - landed));
  BB.rotation.z = -0.6 * Math.sin(clamp((t - 8.38) / 0.22) * Math.PI) * (t > 8.36 && t < 8.62 ? 1 : 0);
  const flap = Math.sin(TAU * 6 * t) * (1 - 0.7 * perch) * (1 - landed);
  for (const w of wings) w.rotation.x = -w.userData.s * (0.2 + 0.9 * flap) * (1 - 0.8 * landed);
}

function pose(t) {
  const lift = house(t);
  applySnoopy(snoopy(t));
  for (const f of flames) { f.userData.vis = lift > 0.02; f.scale.set(1, (0.4 + lift * 0.8) * (0.85 + 0.25 * Math.sin(t * 47 + f.position.x * 9)), 1); }
  for (const m of scarves) {
    const P = m.geometry.attributes.position, b = m.userData.base;
    for (let i = 0; i < P.count; i++) { const x = b[i * 3], u = -x;
      P.setXYZ(i, x * (0.8 + 0.2 * Math.min(1, lift + 0.2)), b[i * 3 + 1] + 0.1 * u * Math.sin(u * 7 - t * 16 + m.userData.k) - 0.12 * u * (1 - lift), b[i * 3 + 2] + 0.08 * u * Math.sin(u * 5 - t * 11)); }
    P.needsUpdate = true; m.geometry.computeVertexNormals();
  }
  const on = toggleOn(t);
  knob.position.x = 0.66 * on;
  pillM.color.copy(PILL_OFF).lerp(PILL_ON, on);
  pill.userData.m2.color.set(PAPER).lerp(new THREE.Color('#3c3c3c'), on);
  bird(t); house(t);
  const tc = t - TAP - 0.03; // confetti from the switch, drifting in zero gravity
  for (let i = 0; i < NC; i++) {
    const c = confData[i], o = new THREE.Object3D();
    if (tc <= c.d || t > 8.9) o.scale.setScalar(0);
    else { const s = tc - c.d, f = (1 - Math.exp(-1.4 * s)) / 1.4;
      o.position.set(KNOB0.x + 0.3 + c.v.x * f, KNOB0.y + c.v.y * f, KNOB0.z + 0.1 + c.v.z * f);
      o.rotation.set(c.r.x + c.w.x * s, c.r.y + c.w.y * s, c.r.z + c.w.z * s); }
    o.updateMatrix(); conf.setMatrixAt(i, o.matrix);
  }
  conf.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < NS; i++) { const [x, y, z, sp] = starBase[i], tt = Math.max(0, t - 4.3);
    starPos[i * 3] = ((x - sp * tt * (0.3 + lift)) % 30 + 45) % 30 - 15; starPos[i * 3 + 1] = y; starPos[i * 3 + 2] = z; }
  starGeo.attributes.position.needsUpdate = true;
  const pt = (t - 4.57) / 0.5;
  for (const m of puffs) {
    m.userData.vis = pt > 0 && pt < 1;
    if (m.userData.vis) { m.position.copy(KNOB_ON).add(V(0, 0.15, 0.25)).addScaledVector(m.userData.dir, 0.1 + 0.4 * pt); m.scale.setScalar(1.2 * (1 - pt) + 0.3); m.material.opacity = 1 - pt; }
  }
  // camera: flat and frontal for the 2D parts, swings round the flying house in 3D
  const u = ioc((t - 4.95) / 1.2) * (1 - ioc((t - 7.05) / 1.25));
  const tf = V(0.15, 2.85, 0), pf = V(0.15, 2.85, 15.4);
  const th = 0.55 + 0.3 * Math.sin((t - 4.95) * 0.7), to = HOUSE.position.clone().add(V(-0.2, 2.1, 0));
  const po = to.clone().add(V(12.5 * Math.sin(th), 1.8, 12.5 * Math.cos(th)));
  cam.position.lerpVectors(pf, po, u); cam.fov = lerp(22, 32, u); cam.updateProjectionMatrix();
  cam.lookAt(tf.lerp(to, u));
}
function setPass(p) {
  scene.traverse((o) => {
    if (o.isMesh && o.userData.m3) o.material = p === 2 ? o.userData.m2 : o.userData.m3;
    if (o.userData.ol) o.visible = p === 2;
    if (o.userData.only3d) o.visible = p === 3 && o.userData.vis !== false;
    if (o.userData.only2d) o.visible = p === 2 && o.userData.vis !== false;
  });
}

// ---------- the wipe: 3D grows out of the switch, inside a ring of rainbow ----------
const wipeR = (t) => (t < 8.52 ? 1.05 * ioc((t - TAP - 0.02) / 0.7) : 1.05 * (1 - ioc((t - 8.53) / 0.3)));
const comp = new THREE.ShaderMaterial({
  uniforms: { t2: { value: RT2.texture }, t3: { value: RT3.texture }, c: { value: new THREE.Vector2() }, r: { value: 0 }, asp: { value: W / H }, seed: { value: 0 }, tm: { value: 0 }, res: { value: new THREE.Vector2(W, H) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `uniform sampler2D t2, t3; uniform vec2 c, res; uniform float r, asp, seed, tm; varying vec2 vUv;
  float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
  float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+1.),f.x), f.y); }
  vec3 tmap(vec3 x){ vec3 a = clamp(x,0.,.82); vec3 b = max(x-.82,0.); return a + .18*(1.-exp(-b/.18)); }
  vec3 srgb(vec3 c){ return mix(c*12.92, 1.055*pow(c, vec3(1./2.4))-.055, step(.0031308,c)); }
  void main(){
    vec2 q = vUv*vec2(asp,1.);
    vec2 p = (vUv - c)*vec2(asp,1.); float d = length(p);
    float e = d + (n2(normalize(p+1e-5)*3. + tm*1.7) - .5)*.07;
    float m3 = r <= 0. ? 0. : (r >= 1.04 ? 1. : 1. - smoothstep(r-.004, r+.004, e));
    vec2 boil = (vec2(n2(q*7.+seed*13.1), n2(q*7.+seed*7.7+31.)) - .5)*.0028;
    vec3 c2 = srgb(texture2D(t2, vUv + boil).rgb);
    float lum = dot(c2, vec3(.299,.587,.114));
    lum *= .955 + .045*h(floor(vUv*res*.5) + seed);
    lum *= 1. - .1*pow(length(vUv-.5)*1.3, 3.);
    c2 = vec3(lum)*vec3(1.,.99,.965);
    vec3 c3 = srgb(tmap(texture2D(t3, vUv).rgb*0.95));
    c3 = clamp(mix(vec3(dot(c3, vec3(.299,.587,.114))), c3, 1.15), 0., 1.);
    vec3 col = mix(c2, c3, m3);
    float ring = (r > 0. && r < 1.04) ? exp(-pow((e-r)/.011, 2.)) : 0.;
    float a = atan(p.y, p.x);
    vec3 rc = .55 + .45*cos(a + tm*4. + vec3(0., 2.1, 4.2));
    col = mix(col, rc + .25, ring*.9);
    gl_FragColor = vec4(col, 1.);
  }`,
  depthTest: false, depthWrite: false,
});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), comp); quad.frustumCulled = false;
const qScene = new THREE.Scene(); qScene.add(quad); const qCam = new THREE.Camera();

window.frame = (t) => {
  const r = wipeR(t);
  if (r < 1.04) { pose(Math.floor(t * 12 + 1e-6) / 12); setPass(2); R.shadowMap.enabled = false; R.setRenderTarget(RT2); R.render(scene, cam); }
  pose(t);
  if (r > 0) { setPass(3); R.shadowMap.enabled = true; R.setRenderTarget(RT3); R.render(scene, cam); }
  const kp = TOG.localToWorld(knob.position.clone()).project(cam);
  comp.uniforms.c.value.set(kp.x * 0.5 + 0.5, kp.y * 0.5 + 0.5);
  comp.uniforms.r.value = r; comp.uniforms.tm.value = t; comp.uniforms.seed.value = Math.floor(t * 8);
  R.setRenderTarget(null); R.render(qScene, qCam);
};
window.frame(0);
window.DUR = DUR;
document.title = 'ready';
</script></body></html>
