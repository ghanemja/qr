<!-- The toggle trend, beagle edition, animated from the reference drawings themselves (cut into
     pieces by prep.py into ./pieces, which isn't kept in the repo). In black and white he walks up to
     his doghouse, climbs onto the roof, can't reach the switch, and boops it with his nose at the top of
     a big jump. The world turns colour: the flying ace on his doghouse, scarf flying, smoke puffs going
     by, his bird looping round him. The bird switches it off and he sits there, grumpy, glaring at it.
     Render harness: window.frame(t) draws time t (seconds, 0–DUR), timed to the song of the reel it copies. -->
<html><head><meta charset="utf-8"><title>loading</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas><script type="module">
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 1080), H = Math.round(W * 16 / 9), K = W / 1080; // the stage is laid out at 1080 × 1920
const Z = 1.15, ZX = 540, ZY = 1880, DY = 70;  // (and 70 px lower, clear of the app's top bar)                                         // and filmed 15% closer, from the bottom middle
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const layer = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return [c, c.getContext('2d')]; };
const [c2, g2] = layer(), [c3, g3] = layer();
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, t) => { const u = clamp((t - a) / (b - a)); return u * u * (3 - 2 * u); };
const ioc = (u) => (u = clamp(u), u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const hump = (a, b, t) => (t > a && t < b ? Math.sin(Math.PI * (t - a) / (b - a)) : 0);
const TAU = Math.PI * 2;
let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const PAPER = '#f5f1e6', INK = '#161616', CREAM = '#f6efe8';

// ---------- the pieces ----------
const meta = await (await fetch('pieces/pieces.json')).json();
const img = {};
await Promise.all(Object.keys(meta).map((n) => new Promise((ok) => { const i = new Image(); i.onload = ok; i.src = `pieces/${n}.png`; img[n] = i; })));

// ---------- the layout ----------
const GROUND = 1800, HS = 1.05, HX = 600;                           // the doghouse: scale, and where its middle stands
const hm = meta.C_house, ROOF = GROUND - (hm.ground[1] - hm.roof[1]) * HS;   // the roof's top edge (y 1104)
const EAVE = GROUND - (1458 - 1210) * HS;                           // the roof's bottom edge
const AS = 0.55, BS = 0.89, DS = 1.03;                              // the three drawings of him, scaled to one head size
function house(g, bw) {
  const i = bw ? img.C_house_bw : img.C_house;
  g.drawImage(i, HX - hm.ground[0] * HS, GROUND - hm.ground[1] * HS, i.width * HS, i.height * HS);
}
// grass and the ground line either side of the doghouse, drawn like the strip's
const tufts = [...Array(70)].map(() => { const x = rnd() * 1080; return [x, 30 + rnd() * 70, (rnd() - 0.5) * 0.9, 3 + rnd() * 2.5]; })
  .filter(([x]) => x < HX - 400 || x > HX + 400);
function ground(g) {
  g.strokeStyle = INK; g.lineCap = 'round'; g.lineWidth = 7; g.beginPath(); g.moveTo(-10, GROUND);
  for (let x = 0; x <= 1090; x += 30) g.lineTo(x, GROUND + 2 * Math.sin(x * 0.05));
  g.stroke();
  for (const [x, l, a, w] of tufts) { g.lineWidth = w; g.beginPath(); g.moveTo(x, GROUND); g.quadraticCurveTo(x + Math.sin(a) * l * 0.4, GROUND - l * 0.6, x + Math.sin(a) * l, GROUND - l); g.stroke(); }
}
const grain = (() => { const [c, g] = layer(); const d = g.createImageData(W, H);
  for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 14; }
  g.putImageData(d, 0, 0); return c; })();

// ---------- the switch ----------
function toggle(g, k, on, bw) {
  const w = 236, h = 112, r = h / 2, x0 = k.x0 - r, y0 = k.y - r;
  g.beginPath(); g.roundRect(x0, y0, w, h, r);
  g.fillStyle = bw ? (on > 0.5 ? '#3a3a3a' : PAPER) : `rgb(${lerp(209, 52, on)},${lerp(209, 199, on)},${lerp(214, 89, on)})`;
  g.fill(); g.lineWidth = 7; g.strokeStyle = INK; g.stroke();
  const kx = k.x0 + (w - h) * on;
  g.beginPath(); g.arc(kx, k.y, r - 9, 0, TAU); g.fillStyle = bw ? PAPER : '#ffffff'; g.fill(); g.lineWidth = 6; g.stroke();
  return kx;
}

// ---------- the bird (drawn in the strip's manner: a big round head, a beak, a tuft, a little body) ----------
function bird(g, x, y, s, face, flap, bw, peck = 0) {
  // the bird drawing itself; (x, y) is the middle of its head, s about a third of its height
  const body = img[bw ? 'E_wood_bw' : 'E_wood'], wing = img[bw ? 'E_wing_bw' : 'E_wing'], m = meta.E_wood, wp = meta.E_wing.pivot, S = s * 0.0115;
  g.save(); g.translate(x, y); g.scale(S * face, S); g.translate(m.head[0], m.head[1]); g.rotate(peck * 0.5); g.translate(-m.head[0], -m.head[1]);
  g.translate(-m.head[0], -m.head[1]);
  g.drawImage(body, 0, 0);
  g.translate(wp[0], wp[1]); g.rotate(1.1 * flap - 0.2); g.translate(-wp[0], -wp[1]); g.drawImage(wing, 0, 0);
  g.restore();
}

// ---------- him, standing: a cut-out puppet of the standing drawing ----------
const am = meta.A_body.feet;
// P: x, y (feet on screen), sq (squash), lean, head (tilt), legL, legR
function puppet(g, P, bw, probe) {
  g.save(); g.translate(P.x, P.y); g.rotate(P.lean); g.scale(AS / Math.sqrt(P.sq), AS * P.sq); g.translate(-am[0], -am[1]);
  const part = (n, a) => { const pv = meta[n].pivot; g.save(); g.translate(pv[0], pv[1]); g.rotate(a); g.translate(-pv[0], -pv[1]); g.drawImage(img[n], 0, 0); g.restore(); };
  part('A_legL', P.legL); part('A_legR', P.legR); g.drawImage(img.A_body, 0, 0); part('A_head', P.head);
  let nose = null;
  if (probe) { const pv = meta.A_head.pivot; g.translate(pv[0], pv[1]); g.rotate(P.head); g.translate(-pv[0], -pv[1]); nose = new DOMPoint(712, 345).matrixTransform(g.getTransform()); }
  g.restore(); return nose;
}
const XS = -300, XT = 175, XR = 515;  // walk in from off the left to the doghouse; stand on the roof at XR
function snoopyA(t) {
  const P = { x: XT, y: GROUND, sq: 1, lean: 0, head: 0, legL: 0, legR: 0 };
  const walk = (x0, d, amp) => { const ph = TAU * d / 150, s = Math.sin(ph); P.legL = 0.28 * s * amp; P.legR = -0.28 * s * amp; P.y -= 10 * Math.abs(Math.sin(ph)) * amp; P.head = 0.03 * Math.sin(2 * ph) * amp; };
  if (t < 1.9) { const u = clamp(t / 1.9), a = 0.7, v = 2 / (1 + a), s = u < a ? v * u : v * a + v * (u - a) - v * (u - a) ** 2 / (2 * (1 - a));
    P.x = XS + (XT - XS) * s; walk(XS, P.x - XS, u < a ? 1 : 1 - (u - a) / (1 - a)); }
  // look up at the roof, crouch, and jump onto its bottom edge (landing on the click at 2.65 s)
  P.head -= 0.14 * ss(1.95, 2.15, t) * (1 - ss(2.3, 2.45, t));
  P.sq -= 0.12 * hump(2.1, 2.35, t);
  if (t >= 2.3 && t < 2.65) { const p = (t - 2.3) / 0.35; P.x = lerp(XT, 330, p); P.y = lerp(GROUND, EAVE, p) - 120 * Math.sin(Math.PI * p); P.legL = P.legR = -0.2 * Math.sin(Math.PI * p); }
  P.sq -= 0.14 * hump(2.62, 2.78, t);
  // scramble up the roof
  if (t >= 2.65 && t < 3.4) { const q = ss(2.7, 3.35, t); P.x = lerp(330, XR, q); P.y = lerp(EAVE, ROOF, q);
    const k = Math.sin(TAU * 8 * (t - 2.65)) * hump(2.68, 3.4, t); P.legL = 0.5 * k; P.legR = -0.5 * k; P.lean = 0.28 * hump(2.66, 3.45, t); P.y -= 8 * Math.abs(k); }
  if (t >= 3.4) { P.x = XR; P.y = ROOF; }
  // on the roof: stretch up on tiptoe, nose to the switch… short
  const tip = ss(3.45, 3.56, t) * (1 - ss(3.66, 3.74, t));
  P.head -= 0.25 * ss(3.42, 3.55, t) * (1 - ss(4.45, 4.7, t)); P.y -= 16 * tip; P.sq += 0.07 * tip;
  // crouch, and the big jump: nose on the switch at the top (4.3 s, the drop)
  P.sq -= 0.18 * ss(3.72, 3.92, t) * (1 - ss(3.92, 3.99, t));
  if (t > 3.95 && t < 4.65) { const p = (t - 3.95) / 0.7; P.y = ROOF - JUMP * 4 * p * (1 - p); P.legL = P.legR = -0.22 * Math.sin(Math.PI * p); }
  P.sq += 0.1 * ss(3.95, 4.02, t) * (1 - ss(4.05, 4.3, t)) - 0.14 * hump(4.6, 4.85, t);
  return P;
}
const JUMP = 270;
const NOSE = puppet(g2, snoopyA(4.3), true, true);                 // where his nose is at the top of the jump
const KNOB = { x0: NOSE.x + 58, y: NOSE.y - 4 };           // the switch's knob (off), just in front of it
const toggleOn = (t) => ss(4.3, 4.42, t) - ss(8.5, 8.6, t);

// ---------- him, flying (the flying-ace drawing on his doghouse), and him sitting, grumpy (the last drawing, flipped) ----------
const SEATX = 555;
function ace(g, t) {
  const bm = meta.B_ace, sm = meta.B_scarf;
  let drop = 0; if (t < 4.65) { const p = (t - 3.95) / 0.7; drop = JUMP * 4 * p * (1 - p); }
  const sq = 1 - 0.1 * hump(4.62, 4.85, t), bob = 5 * Math.sin(TAU * t / 1.3) * ss(4.8, 5.2, t);
  g.save(); g.translate(SEATX, ROOF - drop + bob); g.scale(BS / Math.sqrt(sq), BS * sq); g.translate(-bm.seat[0], -bm.seat[1]);
  // the scarf, streaming back and rippling: drawn in thin vertical strips
  const si = img.B_scarf, rx = sm.root[0], fl = ss(4.6, 5.0, t);
  for (let x = 0; x < rx + 20; x += 3) { const u = (rx - x) / rx, dy = (10 + 26 * fl) * u * Math.sin(u * 7 - t * 17) - 18 * u * (1 - fl);
    g.drawImage(si, x, 0, 3, si.height, x, dy, 3, si.height); }
  g.drawImage(img.B_ace, 0, 0);
  g.restore();
}
function grumpy(g, t) {
  const dm = meta.D_sit, mad = t > 8.78 ? 1 : 0, sh = mad && t < 9.95 ? 3 * Math.sin(t * 90) : 0;
  g.save(); g.translate(SEATX + sh, ROOF); g.scale(-DS, DS * (1 + 0.03 * hump(8.75, 8.92, t))); g.translate(-dm.seat[0], -dm.seat[1]);
  g.drawImage(img.D_sit, 0, 0); g.restore();
  if (t > 8.86) scribble(g, SEATX + 30 + sh, ROOF - dm.seat[1] * DS - 40, Math.floor(t * 8) % 3);
}
const scribs = [0, 1, 2].map(() => { const p = [[-90, 0]]; for (let i = 0; i < 44; i++) p.push([(rnd() - 0.5) * 190, (rnd() - 0.5) * 110, (rnd() - 0.5) * 190, (rnd() - 0.5) * 110]); return p; });
function scribble(g, x, y, k) {
  const p = scribs[k]; g.save(); g.translate(x, y); g.strokeStyle = INK; g.lineWidth = 5; g.lineCap = g.lineJoin = 'round';
  g.beginPath(); g.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) g.quadraticCurveTo(p[i][2], p[i][3], p[i][0], p[i][1]); g.stroke(); g.restore();
}

// ---------- the bird's flight ----------
function birdAt(t) {
  const kOn = { x: KNOB.x0 + 124, y: KNOB.y };
  const a = TAU * (t - 4.6) / 2.3 - 1.2;
  const orbit = { x: SEATX + 330 * Math.cos(a), y: ROOF - 320 + 110 * Math.sin(a) + 30 * Math.sin(2 * a) };
  const start = { x: kOn.x + 40, y: kOn.y - 120 }, perch = { x: kOn.x + 10, y: kOn.y - 44 - (432 - 160) * 30 * 0.0115 };
  let p = { x: lerp(start.x, orbit.x, ss(4.6, 5.4, t)), y: lerp(start.y, orbit.y, ss(4.6, 5.4, t)) };
  const k = ss(7.6, 8.32, t); p = { x: lerp(p.x, perch.x, k), y: lerp(p.y, perch.y, k) };
  p.y -= 26 * hump(9.12, 9.32, t);                                   // startled
  const f = ss(9.3, 10.1, t); if (f > 0) p = { x: lerp(perch.x, 1250, f * f), y: lerp(perch.y, -150, f * f) };
  return { ...p, front: Math.sin(a) > 0 || t > 7.8, a };
}
function drawBird(g, t, bw) {
  if (t < 4.6) return;
  const p = birdAt(t), q = birdAt(t + 0.03), sc = 30 * Math.min(1, (t - 4.6) / 0.25) * (1 + 0.3 * hump(4.6, 4.9, t));
  const perched = t > 8.3 && t < 9.32, face = perched ? -1 : (q.x >= p.x ? 1 : -1);
  const peck = hump(8.38, 8.6, t), flap = perched ? 0.15 : Math.sin(TAU * 6 * t);
  bird(g, p.x, p.y, sc, face, flap, bw, peck);
}

// ---------- the two worlds ----------
function world2(g, t) {
  g.fillStyle = PAPER; g.fillRect(-200, -400, 1480, 2400);
  ground(g); house(g, true);
  toggle(g, KNOB, toggleOn(t), true);
  if (t < 8.5) puppet(g, snoopyA(t), true); else grumpy(g, t);
  if (t > 8.4) drawBird(g, t, true);
}
function world3(g, t) {
  g.fillStyle = CREAM; g.fillRect(-200, -400, 1480, 2400);
  g.drawImage(img.C_moon, 130, 360, 200, 205);
  // smoke puffs going by (he's flying, the house stays put)
  for (let i = 0; i < 5; i++) { const pi = img['puff' + (i % 2)], sp = 300 + 60 * i, x = 1250 - ((t - 4.3) * sp + i * 380) % 1600, y = 520 + ((i * 173) % 430);
    g.drawImage(pi, x, y, pi.width * 0.9, pi.height * 0.9); }
  ground(g); house(g, false);
  toggle(g, KNOB, toggleOn(t), false);
  const b = birdAt(t);
  if (!b.front) drawBird(g, t, false);
  ace(g, t);
  if (b.front) drawBird(g, t, false);
}
// the wipe: colour grows out of the switch inside a rainbow ring, and shrinks back into it
const wipeR = (t) => (t < 8.52 ? 2300 * ioc((t - 4.32) / 0.75) : 2300 * (1 - ioc((t - 8.53) / 0.32)));
function ring(g, cx, cy, r, t) {
  g.beginPath();
  for (let i = 0; i <= 96; i++) { const a = i / 96 * TAU, n = 1 + 0.06 * Math.sin(a * 5 + t * 7) + 0.04 * Math.sin(a * 9 - t * 5);
    const x = cx + Math.cos(a) * r * n, y = cy + Math.sin(a) * r * n; i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.closePath();
}
window.frame = (t) => {
  const r = wipeR(t), tq = Math.floor(t * 12 + 1e-6) / 12;   // the black-and-white world moves on twos, like old cartoons
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (r < 2290) { g2.setTransform(K * Z, 0, 0, K * Z, K * ZX * (1 - Z), K * (ZY * (1 - Z) + DY)); world2(g2, tq); g2.setTransform(1, 0, 0, 1, 0, 0); g2.drawImage(grain, 0, 0); ctx.drawImage(c2, 0, 0); }
  if (r > 0) {
    g3.setTransform(K * Z, 0, 0, K * Z, K * ZX * (1 - Z), K * (ZY * (1 - Z) + DY)); world3(g3, t); g3.setTransform(1, 0, 0, 1, 0, 0); g3.globalAlpha = 0.5; g3.drawImage(grain, 0, 0); g3.globalAlpha = 1;
    const kx = (ZX + (KNOB.x0 + (236 - 112) * toggleOn(t) - ZX) * Z) * K, ky = (ZY + (KNOB.y - ZY) * Z + DY) * K;
    ctx.save(); ring(ctx, kx, ky, r * K, t); ctx.clip(); ctx.drawImage(c3, 0, 0); ctx.restore();
    if (r < 2290) { ring(ctx, kx, ky, r * K, t); const cg = ctx.createConicGradient(t * 4, kx, ky);
      ['#ff5f6d', '#ffc371', '#fff36b', '#5ef08a', '#4fc3ff', '#b57bff', '#ff5f6d'].forEach((c, i, a) => cg.addColorStop(i / (a.length - 1), c));
      ctx.strokeStyle = cg; ctx.lineWidth = 16 * K; ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 18 * K; ctx.stroke(); ctx.shadowBlur = 0; }
  }
};
window.DUR = 10.4;
window.frame(0);
document.title = 'ready';
</script></body></html>
