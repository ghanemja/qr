<!-- The ad's QR shot: the site's own QR world (src/qrsculpture.js) for one company, full screen,
     with captions. render.cjs drives it on a fake clock: window.cue(seconds) runs the script below. -->
<meta charset="utf-8">
<title>QR shot</title>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #f6f1e7; font-family: Inter, sans-serif; color: #17202c; }
  #stage { position: absolute; inset: 0; }
  .ov { position: absolute; left: 0; right: 0; text-align: center; opacity: 0; pointer-events: none; text-shadow: 0 2px 26px #f6f1e7, 0 0 10px #f6f1e7; }
  .ov b { display: block; font: 800 76px/1.05 'Inter Display', Inter, sans-serif; letter-spacing: -2px; }
  .ov span { display: block; margin-top: 14px; font: 500 36px/1.2 Inter, sans-serif; color: #4a5566; }
  #c1 { top: 150px; } #c2 { top: 150px; }
  #act { position: absolute; left: 96px; top: 80px; padding: 14px 26px; border-radius: 999px; background: #17202c; color: #f6f1e7; font: 700 30px/1 Inter, sans-serif; }
  #act b { color: #f0a46b; margin-right: 12px; }
  /* ?fmt=reel (9:16, 1080×1920): bigger words, kept clear of Instagram's own UI. */
  .reel #act { display: none; }
  .reel #c1, .reel #c2 { top: 260px; padding: 0 70px; }
  .reel .ov b { font-size: 104px; letter-spacing: -3px; }
  .reel .ov span { margin-top: 20px; font-size: 46px; }
</style>
<script type="importmap">{"imports":{"three":"/qr/assets/three.module.min.js"}}</script>
<div id="stage"></div>
<div id="c1" class="ov"><b></b><span>Tap any world…</span></div>
<div id="c2" class="ov"><b>…and it’s a real QR code.</b><span>Scan it to open the company’s page, or point it at any link.</span></div>
<!-- ?click=1: a mouse pointer that clicks the world into its code and back. -->
<svg id="cursor" viewBox="0 0 24 30" width="92" height="115" style="position:absolute;left:0;top:0;display:none;z-index:9;transform-origin:4px 3px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.28))"><path d="M3 2 L3 24 L8.6 18.8 L12.4 27.4 L16.2 25.8 L12.5 17.4 L20 17.2 Z" fill="#17202c" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
<div id="ring" style="position:absolute;display:none;z-index:8;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:6px solid #e07a3f;opacity:0"></div>
<div id="act"><b>2</b>Scan: every world is a real QR code</div>
<script type="module">
import { createQRWorld } from '/qr/assets/qrsculpture.js';
const Q = new URLSearchParams(location.search), slug = Q.get('slug') || 'coca-cola', REEL = Q.get('fmt') === 'reel';
document.documentElement.classList.toggle('reel', REEL);
if (REEL && Q.get('text') !== '1') document.head.insertAdjacentHTML('beforeend', '<style>.ov, #act { display: none; }</style>');
// In a reel, the code holds still long enough to scan straight off the screen.
if (REEL) document.querySelector('#c2 span').textContent = 'Pause and scan it with your camera.';
const html = await (await fetch(`/qr/c/${slug}.html`)).text();
const C = JSON.parse(html.match(/window\.COMPANY=(\{.*?\});<\/script>/)[1]);
document.querySelector('#c1 b').textContent = C.name;
const CLICK = Q.get('click') === '1';
const world = createQRWorld(document.getElementById('stage'), { slug: C.slug, model: C.model, look: C.look, qr: C.qr, viewScale: 1.3, autoRotate: !CLICK, insets: () => (REEL ? (Q.get('text') === '1' ? { top: 620, bottom: 520 } : { top: 300, bottom: 300 }) : { top: 300, bottom: 50 }) });
// The shot, in seconds from its first frame (the world has already grown in by then).
// With ?click=1 the world plays a while first, then the pointer clicks it into its code and back.
const SCAN = CLICK ? 6 : 1, BACK = CLICK ? 12.5 : 5.6;
// Playback rate of the page's clock at shot time t: the breakdown plays at half speed so every
// pixel can be seen peeling off and landing; the rebuild a little faster.
window.rate = (t) => (t >= SCAN && t < SCAN + 3.4 ? 0.5 : t >= BACK && t < BACK + 2.4 ? 0.7 : 1);
let scanned = false, back = false;
const ease = (x) => (x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x));
const fade = (u, a, b, c, d) => Math.min(ease((u - a) / (b - a)), 1 - ease((u - c) / (d - c)));
// The pointer's path: in from the lower right, onto the model, click; onto the code, click; away.
const cur = document.getElementById('cursor'), ring = document.getElementById('ring');
const KEYS = [[3.2, 1180, 2050], [5.3, 600, 1010], [6, 600, 1010], [9.6, 600, 1010], [11.6, 520, 960], [12.5, 520, 960], [14.4, 1180, 2100]];
const lerp = (a, b, k) => a + (b - a) * k;
function pointer(t) {
  let i = KEYS.findIndex((k) => t < k[0]);
  if (i === 0 || i === -1) return null;
  const [t0, x0, y0] = KEYS[i - 1], [t1, x1, y1] = KEYS[i], k = ease((t - t0) / (t1 - t0));
  // A slight arc, as a hand moves a mouse.
  return [lerp(x0, x1, k) + Math.sin(k * Math.PI) * 60, lerp(y0, y1, k)];
}
function drawPointer(t) {
  const p = pointer(t);
  cur.style.display = p ? 'block' : 'none';
  if (!p) return;
  const press = [SCAN, BACK].some((c) => t >= c - 0.08 && t < c + 0.14);
  cur.style.left = `${p[0] - 4}px`; cur.style.top = `${p[1] - 3}px`;
  cur.style.transform = `scale(${press ? 0.84 : 1})`;
  const c = [SCAN, BACK].find((c) => t >= c && t < c + 0.6);
  ring.style.display = c != null ? 'block' : 'none';
  if (c != null) { const k = (t - c) / 0.6; ring.style.left = `${p[0]}px`; ring.style.top = `${p[1]}px`; ring.style.transform = `scale(${0.3 + k * 1.2})`; ring.style.opacity = 1 - k; }
}
window.cue = (t) => {
  if (CLICK) drawPointer(t);
  if (t >= SCAN && !scanned) { scanned = true; world.setScan(true); }
  if (t >= BACK && !back) { back = true; world.setScan(false); }
  const c1 = document.getElementById('c1'), c2 = document.getElementById('c2');
  c1.style.opacity = fade(t, 0.05, 0.35, 1.3, 1.7);
  c2.style.opacity = fade(t, 3.8, 4.2, 5.5, 5.9);
  c2.style.transform = `translateY(${(1 - ease((t - 3.8) / 0.4)) * -24}px)`;
};
window.world = world;
</script>
