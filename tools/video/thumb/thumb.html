<!-- "Slide your thumb up! Feel the beat": the thumb-swipe trend, QR Compass edition (9:16, 60 fps).
     Timed to the original reel's song: a beat every 0.4073 s from 0 (the reel cuts every 8 beats
     and its actions land on these beats). The thumb flips up on the even beats and down on the
     odd ones, as the reel's demo does. After the opening card it cuts on every beat: on an up beat
     a company's world sends something up (the Roadster off its ramp, the SpaceX booster, the
     Amazon drone, a rocket, the Starship); on a down beat something comes
     down (Buffett's snowball down the Berkshire slope, the booster landing, the Oreo dunk, cereal
     pouring, an excavator digging). Then the swipes morph it: each up beat breaks the world on
     screen into the QR code in place, each down beat flies the code back out into a world, and the
     last up beat lands the real, scannable code. The opening card uses the reel's own thumb
     drawings (cut out by extract_thumb.py into reel/, kept out of the repo like the song).
     window.frame(seconds) draws any moment; render.cjs captures it. -->
<meta charset="utf-8">
<title>loading</title>
<style>html, body { margin: 0; background: #f6f1e7; overflow: hidden; } canvas { display: block; }</style>
<script type="importmap">{"imports":{"three":"/qr/assets/three.module.min.js"}}</script>
<script src="/qr/assets/qrcode.js"></script>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { world } from './model.js';
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const INK = '#17202c', CREAM = '#f6f1e7', ORANGE = '#e07a3f', SKY = '#a4dafc';
const URL_ = 'https://ghanemja.github.io/qr/';

// ---- the song's grid: beat k at 0.4073 k s (from the reel: its cuts at 3.24, 6.49, 9.73 and
// 13.01 s are every 8 beats, and its actions land on the beats in between) ----
const BEAT = 0.4073, K = (k) => BEAT * k;
const S = { intro: 0, montage: K(8), build: K(24), code: K(32) };
window.DURATION = +(BEAT * 40).toFixed(3); // 10 bars, so it loops like the reel
// Up on the even beats, down on the odd ones: 20 cycles.
const UP = (n) => K(2 * n), DN = (n) => K(2 * n + 1);
const UPS = Array.from({ length: 20 }, (_, n) => UP(n)), DNS = Array.from({ length: 20 }, (_, n) => DN(n));
const ups = (s) => UPS.slice(4 * s, 4 * s + 4), dns = (s) => DNS.slice(4 * s, 4 * s + 4);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeOut = (x) => 1 - (1 - clamp(x)) ** 3;
const easeIn = (x) => clamp(x) ** 3;
function back(x) { x = clamp(x); const s = 1.7; return 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2; }
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (seed) => () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const since = (T, hits) => { let d = Infinity; for (const h of hits) if (T >= h) d = T - h; return d; };
// How far up the thumb is (0 down, 1 up). A flip takes `dur` and is centred on its beat, so the
// pose lands on the beat itself.
function thumbUp(T, dur = 0.12, curve = back) {
  let lastU = -Infinity, lastD = -Infinity;
  for (const u of UPS) if (T >= u - dur / 2) lastU = u;
  for (const d of DNS) if (T >= d - dur / 2) lastD = d;
  if (lastU > lastD) return curve((T - lastU + dur / 2) / dur);
  if (lastD === -Infinity) return 0;
  return 1 - curve((T - lastD + dur / 2) / dur);
}

// ---- the QR code ----
const q = qrcode(0, 'H'); q.addData(URL_); q.make();
const N = q.getModuleCount(), MOD = 22, QX = Math.round(W / 2 - (N * MOD) / 2), QY = 470;
const DARK = [];
for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (q.isDark(r, c)) DARK.push({ r, c, x: QX + (c + 0.5) * MOD, y: QY + (r + 0.5) * MOD });

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function background(T, col = CREAM) {
  ctx.fillStyle = col; ctx.fillRect(-100, -100, W + 200, H + 200);
  if (col !== CREAM) return;
  const R = rand(3); ctx.fillStyle = 'rgba(23,32,44,0.045)';
  for (let i = 0; i < 70; i++) {
    const x = R() * W, s = 10 + R() * 26, y = ((R() * (H + 200) - T * (40 + R() * 60)) % (H + 200) + H + 200) % (H + 200) - 100;
    rr(x, y, s, s, 4); ctx.fill();
  }
}

// ---- the opening card: the reel's look, its target ring and its own thumb ----
// The stage is the reel scaled to 1080 wide, its bottom edge (just above TikTok's bar) on ours.
function title() {
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.font = "800 92px 'Inter Display', Inter";
  for (const [txt, y] of [['SLIDE YOUR THUMB UP!', 385], ['FEEL THE BEAT', 529]]) {
    const w = ctx.measureText('SLIDE YOUR THUMB UP!').width, k = 958 / w; // the reel's condensed width
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(k, 1);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 7 / k; ctx.strokeText(txt, 0, 0);
    ctx.fillStyle = '#121417'; ctx.fillText(txt, 0, 0); ctx.restore();
  }
  ctx.restore();
}
// The target ring, drawn over the thumb the way the reel's is: its rings darken what's under them
// (multiply) and its middle lightens (screen).
function ring() {
  const cx = 983.5, cy = 575.7;
  ctx.save();
  for (const [ro, ri, op, c] of [[74.5, 54, 'multiply', 150], [54, 44, 'multiply', 181], [44, 34.4, 'multiply', 200], [34.4, 0, 'screen', 97]]) {
    ctx.globalCompositeOperation = op; ctx.fillStyle = `rgb(${c},${c},${c})`;
    ctx.beginPath(); ctx.arc(cx, cy, ro, 0, 2 * Math.PI); if (ri) ctx.arc(cx, cy, ri, 0, 2 * Math.PI, true); ctx.fill('evenodd');
  }
  ctx.restore();
}
// The reel's thumb: 48 drawings, one screen-recording frame each of one cycle. Drawing 2 is where
// it arrives up and drawing 23 where it arrives down; each half is stretched onto its beat.
const REEL = await Promise.all(Array.from({ length: 48 }, (_, k) => new Promise((ok, no) => {
  const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error('run extract_thumb.py first')); im.src = `reel/t${String(k).padStart(2, '0')}.png`;
})));
function reelThumb(T) {
  const n = Math.floor(T / BEAT), u = T / BEAT - n;
  const k = n % 2 === 0 ? 2 + Math.floor(u * 21) : (23 + Math.floor(u * 27)) % 48;
  ctx.drawImage(REEL[k], 0, 0);
}

// ---- the 3D worlds ----
const SLUGS = ['tesla', 'berkshire-hathaway', 'spacex', 'amazon', 'mondelez-international', 'relativity-space', 'general-mills', 'caterpillar'];
const WORLD = {};
for (const s of SLUGS) WORLD[s] = await world(s, W, H);

// The SpaceX booster flown by us (a smooth climb or a landing), with its flame and smoke.
const pose = (o, mv, t) => {
  const q = mv.anim(t);
  o.position.set(mv.pivot[0] + (q.x || 0), mv.pivot[1] + (q.y || 0), mv.pivot[2] + (q.z || 0));
  if (q.q) o.quaternion.copy(q.q); else o.rotation.set(q.rx || 0, q.ry || 0, q.rz || 0);
  const s0 = q.s ?? 1, sx = q.sx ?? s0, sy = q.sy ?? s0, sz = q.sz ?? s0;
  o.scale.set(Math.max(1e-3, sx), Math.max(1e-3, sy), Math.max(1e-3, sz)); o.visible = Math.min(sx, sy, sz) > 2e-3;
};
const flyBooster = (alt, burn, puff, T) => (nodes) => {
  for (let i = 20; i < nodes.length; i++) pose(nodes[i].o, nodes[i].mv, 1 + T * 0.3); // boat, gulls, Starship parked
  const body = nodes[0].o; body.position.y += alt;
  body.rotation.z = Math.sin(T * 6) * 0.02 * Math.min(1, alt / 3);
  const flame = nodes[9].o; flame.visible = burn;
  if (burn) flame.scale.set(1 + Math.sin(T * 29) * 0.06, 1.1 + Math.sin(T * 37) * 0.14, 1 + Math.sin(T * 31) * 0.06);
  for (let i = 10; i < 20; i++) { // smoke: puff in [0, 1] spreads it out, then it fades
    const k = puff <= 0 ? 0 : puff < 0.3 ? easeOut(puff / 0.3) : 1 - ease((puff - 0.3) / 0.7);
    pose(nodes[i].o, nodes[i].mv, 10 * (k >= 1 ? 0.8 : puff < 0.3 ? 0.72 + 0.08 * k : 0.84 + 0.11 * (1 - k)));
  }
};

// The montage: one shot per beat from beat 8 to beat 23. Each runs its world's own clock at a
// steady rate (t0 at the cut), so motion is smooth, and the action starts on the cut, which is
// the beat. Up shots drift up a touch and down shots drift down, with the swipe.
const V = (az, elev, dist, pin, y = 1150) => ({ az, elev, dist, pin, at: [W / 2, y] });
const SHOTS = [
  { dir: 1, slug: 'tesla', t0: 2.0, rate: 2.6, view: V(-Math.PI / 4 + 0.1, 0.3, 19, [-0.1, 1.6, 3.35], 1080) },
  { dir: -1, slug: 'berkshire-hathaway', t0: 3.9, rate: 1.7, view: V(Math.PI / 4 - 0.2, 0.5, 26, [0, 1.8, 0]) },
  { dir: 1, slug: 'spacex', booster: 'up', view: V(Math.PI / 4 + 0.1, 0.18, 30, [0, 4.6, 0], 1300) },
  { dir: -1, slug: 'mondelez-international', t0: 5.15, rate: 1.4, view: V(Math.PI / 4 + 0.2, 0.42, 17, [-0.6, 1.8, 1.4], 1150) },
  { dir: 1, slug: 'amazon', t0: 3.95, rate: 2.0, view: V(Math.PI / 4 - 0.15, 0.3, 26, [0, 4.0, 0], 1350) },
  { dir: -1, slug: 'spacex', booster: 'down', view: V(Math.PI / 4 + 0.7, 0.2, 30, [0, 4.6, 0], 1300) },
  { dir: 1, slug: 'relativity-space', t0: 9.9, rate: 2.3, view: V(Math.PI / 4 + 0.2, 0.12, 22, [-3, 3.4, -3], 1300) },
  { dir: -1, slug: 'general-mills', t0: 3.4, rate: 1.6, view: V(Math.PI / 4 - 0.1, 0.4, 19, [0, 1.6, 0], 1150) },
  { dir: 1, slug: 'spacex', booster: 'up', view: V(Math.PI / 4 - 0.7, 0.1, 24, [0, 4.6, 0], 1400) },
  { dir: -1, slug: 'berkshire-hathaway', t0: 5.0, rate: 1.5, view: V(-0.25, 0.32, 20, [1.4, 1.0, 0.6]) },
  { dir: 1, slug: 'spacex', t0: 5.25, rate: 2.2, view: V(Math.PI / 4 - 0.3, 0.16, 15, [4.05, 3.0, -4.05], 1350) },
  { dir: -1, slug: 'caterpillar', t0: 3.0, rate: 1.6, view: V(Math.PI / 4, 0.55, 20, [0, 0.8, 0], 1150) },
  { dir: 1, slug: 'tesla', t0: 2.0, rate: 2.6, view: V(-Math.PI / 2 - 0.35, 0.2, 17, [-0.1, 1.6, 3.35], 1060) },
  { dir: -1, slug: 'spacex', booster: 'down', view: V(Math.PI / 4 - 0.6, 0.12, 26, [0, 4.0, 0], 1350) },
  { dir: 1, slug: 'amazon', t0: 4.0, rate: 2.0, view: V(Math.PI / 4 + 0.6, 0.22, 28, [0, 4.4, 0], 1400) },
  { dir: -1, slug: 'mondelez-international', t0: 5.15, rate: 1.4, view: V(-0.1, 0.3, 15, [-0.6, 1.8, 1.4], 1150) },
];
function montage(T) {
  const i = clamp(Math.floor((T - S.montage) / BEAT), 0, SHOTS.length - 1), sh = SHOTS[i], u = (T - S.montage - i * BEAT) / BEAT;
  const w = WORLD[sh.slug], drift = sh.dir * (1 - easeOut(u)) * 70;
  const view = { ...sh.view, at: [sh.view.at[0], sh.view.at[1] + drift], az: sh.view.az + 0.12 * u };
  if (sh.booster === 'up') {
    const alt = 9 * u ** 1.7; // accelerating off the deck
    view.after = flyBooster(alt, true, u + 0.15, T);
    ctx.drawImage(w.render(6.0, view), 0, 0);
  } else if (sh.booster === 'down') {
    const alt = 7 * (1 - easeOut(u / 0.92)); // decelerating onto the deck, touching down just before the next beat
    view.after = flyBooster(alt, alt > 0.02, u > 0.85 ? (u - 0.85) * 3 : 0, T);
    ctx.drawImage(w.render(6.0, view), 0, 0);
  } else ctx.drawImage(w.render(sh.t0 + u * BEAT * sh.rate, view), 0, 0);
}

// ---- the morphs: each up beat breaks the world on screen into the QR code, right where it is;
// each down beat flies the code back out into the next world. The last up beat (the code
// section) lands the real code. ----
const MD = 0.3; // how long a morph takes, starting on its beat
const LAST = SHOTS[SHOTS.length - 1];
const HOLDS = [
  // 0: the montage's last shot, as it is on beat 24
  { slug: LAST.slug, still: () => WORLD[LAST.slug].render(LAST.t0 + BEAT * LAST.rate, { ...LAST.view, az: LAST.view.az + 0.12 }) },
  { slug: 'tesla', t0: 2.0, rate: 2.6, view: V(-Math.PI / 4 + 0.1, 0.3, 19, [-0.1, 1.6, 3.35], 880) },
  { slug: 'berkshire-hathaway', t0: 3.9, rate: 1.7, view: V(Math.PI / 4 - 0.2, 0.5, 26, [0, 1.8, 0], 900) },
  { slug: 'amazon', t0: 3.95, rate: 2.0, view: V(Math.PI / 4 - 0.15, 0.3, 26, [0, 4.0, 0], 1000) },
  { slug: 'spacex', t0: 5.25, rate: 2.2, view: V(Math.PI / 4 - 0.3, 0.16, 15, [4.05, 3.0, -4.05], 950) },
];
HOLDS.forEach((h, i) => { h.down = K(23 + 2 * i); }); // hold i comes in on down beat 23 + 2i (hold 0: the montage)
const holdRender = (h, T) => WORLD[h.slug].render(h.t0 + (T - h.down) * h.rate, h.view);
// Pair the world's opaque pixels with the code's dark squares, band by band from the top, so the
// world's top goes to the code's top rows.
function pairs(img, seed) {
  const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H; const tc = tmp.getContext('2d');
  tc.drawImage(img, 0, 0); const data = tc.getImageData(0, 0, W, H).data;
  let step = 26, src;
  do { src = []; for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) { const i = (y * W + x) * 4; if (data[i + 3] > 200) src.push({ x, y, col: [data[i], data[i + 1], data[i + 2]] }); } step -= 1; } while (src.length < DARK.length && step > 4);
  const keep = Array.from({ length: DARK.length }, (_, i) => src[Math.floor((i * src.length) / DARK.length)]).sort((a, b) => a.y - b.y || a.x - b.x);
  const mods = [...DARK].sort((a, b) => a.r - b.r || a.c - b.c), bands = 12, per = Math.ceil(DARK.length / bands), R = rand(seed), ps = [];
  for (let b = 0; b < bands; b++) {
    const sb = keep.slice(b * per, (b + 1) * per).sort((p, q) => p.x - q.x), mb = mods.slice(b * per, (b + 1) * per).sort((p, q) => p.c - q.c || p.r - q.r);
    sb.forEach((p, i) => ps.push({ s: p, d: mb[i], delay: R() * 0.06, arc: (R() - 0.5) * 160, spin: (R() - 0.5) * 7 }));
  }
  return { img: tmp, ps, size: step + 1 };
}
HOLDS.forEach((h, i) => { const T = i ? h.down + 0.7 * BEAT : S.build; h.p = pairs(i ? holdRender(h, T) : h.still(), 60 + i); });

// k runs 0 → 1 over a morph; toQR flies world → code, otherwise code → world.
function squares(P, d, toQR, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha;
  for (const p of P.ps) {
    const k = clamp((d - p.delay) / MD), e = easeOut(k), f = toQR ? k : 1 - k;
    const a = toQR ? p.s : p.d, b = toQR ? p.d : p.s;
    const x = lerp(a.x, b.x, e) + p.arc * Math.sin(k * Math.PI), y = lerp(a.y, b.y, e);
    const [r, g, bl] = p.s.col, mix = ease((f - 0.3) / 0.7), c = (v, w) => Math.round(lerp(v, w, mix));
    const s = lerp(P.size, MOD + 0.6, ease(f));
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.spin * Math.sin(k * Math.PI));
    ctx.fillStyle = `rgb(${c(r, 23)},${c(g, 32)},${c(bl, 44)})`; ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.restore();
  }
  ctx.restore();
}
function qrCode(alpha = 1, lift = 0) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(0, -lift); codeCard();
  ctx.fillStyle = INK; for (const m of DARK) ctx.fillRect(QX + m.c * MOD, QY + m.r * MOD, MOD, MOD);
  ctx.restore();
}
function toQR(h, d) { // world still → code
  ctx.save(); ctx.globalAlpha = 1 - ease(d / 0.12); ctx.drawImage(h.p.img, 0, 0); ctx.restore();
  ctx.save(); ctx.globalAlpha = ease((d - 0.05) / 0.2); codeCard(); ctx.restore();
  if (d < MD + 0.07) squares(h.p, d, true); else qrCode();
}
function fromQR(h, T, d) { // code → live world
  ctx.save(); ctx.globalAlpha = 1 - ease(d / 0.2); codeCard(); ctx.restore();
  const w = ease((d - 0.2) / 0.16);
  if (w > 0) { ctx.save(); ctx.globalAlpha = w; ctx.drawImage(holdRender(h, T), 0, 0); ctx.restore(); }
  if (d < MD + 0.07) squares(h.p, d, false, 1 - ease((d - 0.26) / 0.1));
}
function build(T) {
  const n = Math.floor(T / BEAT + 1e-9), d = T - K(n);
  if (n % 2 === 0) toQR(HOLDS[(n - 24) / 2], d);
  else fromQR(HOLDS[(n - 23) / 2], T, d);
}
function codeCard() {
  const pad = 2 * MOD;
  rr(QX - pad, QY - pad, N * MOD + 2 * pad, N * MOD + 2 * pad, 26); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
}

// ---- the finished code: it hops on each swipe, and confetti squares fly up behind it ----
const CU = ups(4), CD = dns(4);
const CONF = CU.map((h, j) => { const R = rand(40 + j); return Array.from({ length: 46 }, (_, i) => ({ x: (i % 2 ? 0.1 + R() * 0.25 : 0.65 + R() * 0.25) * W, vx: (R() - 0.5) * 500, vy: 2300 + R() * 900, s: 18 + R() * 22, a: R() * 6, va: (R() - 0.5) * 14, col: ['#17202c', ORANGE, '#2b5aa8', '#3ddc84', '#f2c94c'][i % 5] })); });
function code(T) {
  CU.forEach((h, j) => {
    const d = T - h; if (d < 0 || d > 1.6) return;
    for (const p of CONF[j]) {
      const x = p.x + p.vx * d, y = H + 40 - p.vy * d + 0.5 * 3000 * d * d;
      ctx.save(); ctx.translate(x, y); ctx.rotate(p.a + p.va * d); rr(-p.s / 2, -p.s / 2, p.s, p.s, 4); ctx.fillStyle = p.col; ctx.fill(); ctx.restore();
    }
  });
  // Up on the up move, held while the thumb is up, and down with a little squash on the down move.
  const up = T >= CD[0] + 0.1 ? thumbUp(T, 0.2, easeOut) : 0, dd = since(T, CD), sq = dd < 0.22 ? 1 - 0.05 * Math.sin((dd / 0.22) * Math.PI) : 1;
  if (T - S.code < MD + 0.07) { toQR(HOLDS[4], T - S.code); return; }
  const base = QY + N * MOD + 2 * MOD;
  ctx.save(); ctx.translate(0, -40 * up); ctx.translate(W / 2, base); ctx.scale(1 / sq, sq); ctx.translate(-W / 2, -base);
  codeCard();
  ctx.fillStyle = INK;
  for (const m of DARK) ctx.fillRect(QX + m.c * MOD, QY + m.r * MOD, MOD, MOD);
  ctx.restore();
}


// ---- the frame ----
window.frame = (T) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (T < S.montage) { background(T, SKY); title(); reelThumb(T); ring(); return; }
  // One zoom punch, when the real code lands.
  const d = T - S.code - MD, z = d >= 0 && d < 0.8 ? 1 + 0.05 * Math.exp(-d * 6) * Math.min(1, d / 0.05) : 1;
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  background(T);
  if (T < S.build) { montage(T); return; }
  if (T < S.code) { build(T); return; }
  code(T);
};
await document.fonts.load("900 100px 'Inter Display'");
document.title = 'ready';
</script>
