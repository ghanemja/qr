<!-- "Slide your thumb up! Feel the beat": the thumb-swipe trend, QR Compass edition (9:16, 60 fps).
     Timed to the "move your thumb to the beat" sound: a beat every 0.451 s from 0.035 s, its
     drop on beat 9 (4.09 s), where the montage starts. The thumb (the first reel's drawings) flips
     up on the odd beats and down on the even ones on the opening card; after it, the cuts carry
     the rhythm. After the opening card it cuts on every beat: on an up beat a company's
     world sends something up (the Roadster off its ramp, the SpaceX booster, the Amazon drone, a
     rocket, the Starship); on a down beat something comes down (Buffett's snowball down the
     Berkshire slope, the booster landing, the Oreo dunk, cereal pouring, an excavator digging).
     At the end it's the site's QR world: each swipe up breaks the model into cube pixels that
     sweep down into the QR code (sculpture.js, the site's morph posed per frame), each swipe down
     rebuilds the next company from them, and the last swipe up keeps the real, scannable code. The thumb drawings are
     the reel's own (cut out by extract_thumb.py into reel/, kept out of the repo like the song).
     window.frame(seconds) draws any moment; render.cjs captures it. -->
<meta charset="utf-8">
<title>loading</title>
<style>html, body { margin: 0; background: #f6f1e7; overflow: hidden; } canvas { display: block; }</style>
<script type="importmap">{"imports":{"three":"/qr/assets/three.module.min.js"}}</script>
<script src="/qr/assets/qrcode.js"></script>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { world, company } from './model.js';
import { sculpture } from './sculpture.js';
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const INK = '#17202c', CREAM = '#f6f1e7', ORANGE = '#e07a3f', SKY = '#a4dafc';
const URL_ = 'https://ghanemja.github.io/qr/';

// ---- the song's grid ("Move your thumb to the beat" sound, about 133 bpm): beat k at
// 0.0353 + 0.4510 k s, fitted to its beats (all within 22 ms). Its drop is beat 9 (4.09 s). ----
const BEAT = 0.4510, OFF = 0.0353, K = (k) => OFF + BEAT * k;
const beatOf = (T) => Math.floor((T - OFF) / BEAT + 1e-9);
// The montage starts on the drop; beats 25–30 morph world ↔ code; beat 31 lands the code.
const S = { intro: 0, montage: K(9), morph: K(25), code: K(31) };
window.DURATION = +K(35).toFixed(3);
// Up on the odd beats (so the drop is a swipe up), down on the even ones.
const UPS = Array.from({ length: 20 }, (_, n) => K(2 * n + 1)), DNS = Array.from({ length: 20 }, (_, n) => K(2 * n));
const isUp = (n) => ((n % 2) + 2) % 2 === 1;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeOut = (x) => 1 - (1 - clamp(x)) ** 3;
const easeIn = (x) => clamp(x) ** 3;
function back(x) { x = clamp(x); const s = 1.7; return 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2; }
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (seed) => () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const since = (T, hits) => { let d = Infinity; for (const h of hits) if (T >= h) d = T - h; return d; };
// How far up the thumb is (0 down, 1 up). A flip takes `dur` and is centred on its beat, so the
// pose lands on the beat itself.
function thumbUp(T, dur = 0.12, curve = back) {
  let lastU = -Infinity, lastD = -Infinity;
  for (const u of UPS) if (T >= u - dur / 2) lastU = u;
  for (const d of DNS) if (T >= d - dur / 2) lastD = d;
  if (lastU > lastD) return curve((T - lastU + dur / 2) / dur);
  if (lastD === -Infinity) return 0;
  return 1 - curve((T - lastD + dur / 2) / dur);
}

// ---- the QR code ----
const q = qrcode(0, 'H'); q.addData(URL_); q.make();
const N = q.getModuleCount();

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function background(T, col = CREAM) {
  ctx.fillStyle = col; ctx.fillRect(-100, -100, W + 200, H + 200);
  if (col !== CREAM) return;
  const R = rand(3); ctx.fillStyle = 'rgba(23,32,44,0.045)';
  for (let i = 0; i < 70; i++) {
    const x = R() * W, s = 10 + R() * 26, y = ((R() * (H + 200) - T * (40 + R() * 60)) % (H + 200) + H + 200) % (H + 200) - 100;
    rr(x, y, s, s, 4); ctx.fill();
  }
}

// ---- the opening card: the reel's look, its target ring and its own thumb ----
// The stage is the reel scaled to 1080 wide, its bottom edge (just above TikTok's bar) on ours.
function title() {
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.font = "800 92px 'Inter Display', Inter";
  for (const [txt, y] of [['SLIDE YOUR THUMB UP!', 385], ['FEEL THE BEAT', 529]]) {
    const w = ctx.measureText('SLIDE YOUR THUMB UP!').width, k = 958 / w; // the reel's condensed width
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(k, 1);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 7 / k; ctx.strokeText(txt, 0, 0);
    ctx.fillStyle = '#121417'; ctx.fillText(txt, 0, 0); ctx.restore();
  }
  ctx.restore();
}
// The target ring, drawn over the thumb the way the reel's is: its rings darken what's under them
// (multiply) and its middle lightens (screen).
function ring() {
  const cx = 983.5, cy = 575.7;
  ctx.save();
  for (const [ro, ri, op, c] of [[74.5, 54, 'multiply', 150], [54, 44, 'multiply', 181], [44, 34.4, 'multiply', 200], [34.4, 0, 'screen', 97]]) {
    ctx.globalCompositeOperation = op; ctx.fillStyle = `rgb(${c},${c},${c})`;
    ctx.beginPath(); ctx.arc(cx, cy, ro, 0, 2 * Math.PI); if (ri) ctx.arc(cx, cy, ri, 0, 2 * Math.PI, true); ctx.fill('evenodd');
  }
  ctx.restore();
}
// The reel's thumb: 48 drawings, one screen-recording frame each of one cycle. Drawing 2 is where
// it arrives up and drawing 23 where it arrives down; each half is stretched onto its beat.
const REEL = await Promise.all(Array.from({ length: 48 }, (_, k) => new Promise((ok, no) => {
  const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error('run extract_thumb.py first')); im.src = `reel/t${String(k).padStart(2, '0')}.png`;
})));
function reelThumb(T) {
  const n = beatOf(T), u = (T - K(n)) / BEAT;
  const k = isUp(n) ? 2 + Math.floor(u * 21) : (23 + Math.floor(u * 27)) % 48;
  ctx.drawImage(REEL[k], 0, 0);
}

// ---- the 3D worlds ----
const SLUGS = ['tesla', 'berkshire-hathaway', 'spacex', 'amazon', 'mondelez-international', 'relativity-space', 'general-mills', 'caterpillar', 'lockheed-martin', 'mcdonalds', 'kraft-heinz', 'walt-disney', 'conocophillips', 'american-airlines-group', 'zipline'];
const WORLD = {};
for (const s of SLUGS) WORLD[s] = await world(s, W, H);

// The SpaceX booster flown by us (a smooth climb or a landing), with its flame and smoke.
const pose = (o, mv, t) => {
  const q = mv.anim(t);
  o.position.set(mv.pivot[0] + (q.x || 0), mv.pivot[1] + (q.y || 0), mv.pivot[2] + (q.z || 0));
  if (q.q) o.quaternion.copy(q.q); else o.rotation.set(q.rx || 0, q.ry || 0, q.rz || 0);
  const s0 = q.s ?? 1, sx = q.sx ?? s0, sy = q.sy ?? s0, sz = q.sz ?? s0;
  o.scale.set(Math.max(1e-3, sx), Math.max(1e-3, sy), Math.max(1e-3, sz)); o.visible = Math.min(sx, sy, sz) > 2e-3;
};
const flyBooster = (alt, burn, puff, T) => (nodes) => {
  for (let i = 20; i < nodes.length; i++) pose(nodes[i].o, nodes[i].mv, 1 + T * 0.3); // boat, gulls, Starship parked
  const body = nodes[0].o; body.position.y += alt;
  body.rotation.z = Math.sin(T * 6) * 0.02 * Math.min(1, alt / 3);
  const flame = nodes[9].o; flame.visible = burn;
  if (burn) flame.scale.set(1 + Math.sin(T * 29) * 0.06, 1.1 + Math.sin(T * 37) * 0.14, 1 + Math.sin(T * 31) * 0.06);
  for (let i = 10; i < 20; i++) { // smoke: puff in [0, 1] spreads it out, then it fades
    const k = puff <= 0 ? 0 : puff < 0.3 ? easeOut(puff / 0.3) : 1 - ease((puff - 0.3) / 0.7);
    pose(nodes[i].o, nodes[i].mv, 10 * (k >= 1 ? 0.8 : puff < 0.3 ? 0.72 + 0.08 * k : 0.84 + 0.11 * (1 - k)));
  }
};

// The montage: one shot per beat from the drop (beat 9) to beat 24, a hard cut each time the thumb lands.
// Each runs its world's own clock at a steady rate (t0 at the cut), so the action starts the
// moment the thumb arrives, and each cut lands with a quick zoom snap.
const V = (az, elev, dist, pin, y = 1150) => ({ az, elev, dist, pin, at: [W / 2, y] });
const SHOTS = [
  { dir: 1, slug: 'tesla', t0: 2.0, rate: 2.6, view: V(-Math.PI / 4 + 0.1, 0.3, 19, [-0.1, 1.6, 3.35], 1080) },
  { dir: -1, slug: 'berkshire-hathaway', t0: 3.9, rate: 1.7, view: V(Math.PI / 4 - 0.2, 0.5, 26, [0, 1.8, 0]) },
  { dir: 1, slug: 'spacex', booster: 'up', view: V(Math.PI / 4 + 0.1, 0.18, 30, [0, 4.6, 0], 1300) },
  { dir: -1, slug: 'mondelez-international', t0: 5.15, rate: 1.4, view: V(Math.PI / 4 + 0.2, 0.42, 17, [-0.6, 1.8, 1.4], 1150) },
  { dir: 1, slug: 'amazon', t0: 3.95, rate: 2.0, view: V(Math.PI / 4 - 0.15, 0.3, 26, [0, 4.0, 0], 1350) },
  { dir: -1, slug: 'spacex', booster: 'down', view: V(Math.PI / 4 + 0.7, 0.2, 30, [0, 4.6, 0], 1300) },
  { dir: 1, slug: 'relativity-space', t0: 9.9, rate: 2.3, view: V(Math.PI / 4 + 0.2, 0.12, 22, [-3, 3.4, -3], 1300) },
  { dir: -1, slug: 'general-mills', t0: 3.4, rate: 1.6, view: V(Math.PI / 4 - 0.1, 0.4, 19, [0, 1.6, 0], 1150) },
  { dir: 1, slug: 'lockheed-martin', t0: 2.0, rate: 2.2, view: V(Math.PI / 4 - 0.2, 0.3, 20, [0, 1.5, 0], 1250) },
  { dir: -1, slug: 'mcdonalds', t0: 3.85, rate: 1.6, view: V(Math.PI / 4, 0.35, 18, [0, 2.5, 0], 1200) },
  { dir: 1, slug: 'spacex', t0: 5.25, rate: 2.2, view: V(Math.PI / 4 - 0.3, 0.16, 15, [4.05, 3.0, -4.05], 1350) },
  { dir: -1, slug: 'kraft-heinz', t0: 1.2, rate: 2.0, view: V(Math.PI / 4 - 0.1, 0.35, 15, [0, 2.0, 0], 1150) },
  { dir: 1, slug: 'walt-disney', t0: 1.5, rate: 1.6, view: V(Math.PI / 4 + 0.15, 0.3, 24, [0, 3.0, 0], 1000) },
  { dir: -1, slug: 'conocophillips', t0: 2.5, rate: 2.2, view: V(Math.PI / 4 - 0.25, 0.3, 30, [0, 2.5, 0], 1050) },
  { dir: 1, slug: 'american-airlines-group', t0: 5.6, rate: 3.5, view: V(Math.PI / 4 - 0.5, 0.2, 19, [0.3, 1.6, 2.9], 1150) },
  { dir: -1, slug: 'zipline', t0: 5.6, rate: 2.0, view: V(Math.PI / 4, 0.3, 14, [3.2, 2.2, 4.4], 1000) },
];
function montage(T) {
  const i = clamp(Math.floor((T - S.montage) / BEAT + 1e-9), 0, SHOTS.length - 1), sh = SHOTS[i], u = (T - S.montage - i * BEAT) / BEAT;
  const w = WORLD[sh.slug], view = { ...sh.view, az: sh.view.az + 0.12 * u };
  const z = 1 + 0.08 * (1 - easeOut((T - S.montage - i * BEAT) / 0.09)); // the snap on the cut
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  ctx.drawImage(shot(T, sh, w, u, view), 0, 0);
  ctx.restore();
}
function shot(T, sh, w, u, view) {
  if (sh.booster === 'up') {
    const alt = 9 * u ** 1.7; // accelerating off the deck
    view.after = flyBooster(alt, true, u + 0.15, T);
    return w.render(6.0, view);
  }
  if (sh.booster === 'down') {
    const alt = 7 * (1 - easeOut(u / 0.92)); // decelerating onto the deck, touching down just before the next beat
    view.after = flyBooster(alt, alt > 0.02, u > 0.85 ? (u - 0.85) * 3 : 0, T);
    return w.render(6.0, view);
  }
  return w.render(sh.t0 + u * BEAT * sh.rate, view);
}

// ---- the end: the site's QR world. Each swipe up breaks the model into cube pixels that arc
// down onto the code's squares in a diagonal sweep as the camera tilts to top-down (exactly the
// site's morph, sped up to a beat); each swipe down rebuilds a model from them, the next company
// each time; the last swipe up (beat 31) keeps the code. ----
const MDS = 0.36; // one morph: lands just before the next beat
const BITS = Array.from({ length: N * N }, (_, i) => (q.isDark(Math.floor(i / N), i % N) ? '1' : '0')).join('');
const ENDS = [];
for (const s of ['zipline', 'tesla', 'amazon', 'berkshire-hathaway']) ENDS.push(sculpture(await company(s), { n: N, bits: BITS }, W, H));
function morph(T) {
  const n = beatOf(T), k = clamp((T - K(n)) / MDS), cam = ease(clamp(k / 0.85)), t = T - S.morph;
  if (n % 2 === 1) ctx.drawImage(ENDS[(n - 25) / 2].render(k, cam, t), 0, 0); // up: model → code
  else ctx.drawImage(ENDS[(n - 24) / 2].render(1 - k, 1 - cam, t), 0, 0); // down: code → the next model
}

// ---- the finished code: it hops on the swipes, and confetti squares fly up behind it ----
const CU = [31, 33].map(K), CD = [32, 34].map(K), BASE = H / 2 + 0.43 * W;
const CONF = CU.map((h, j) => { const R = rand(40 + j); return Array.from({ length: 46 }, (_, i) => ({ x: (i % 2 ? 0.1 + R() * 0.25 : 0.65 + R() * 0.25) * W, vx: (R() - 0.5) * 500, vy: 2300 + R() * 900, s: 18 + R() * 22, a: R() * 6, va: (R() - 0.5) * 14, col: ['#17202c', ORANGE, '#2b5aa8', '#3ddc84', '#f2c94c'][i % 5] })); });
function code(T) {
  CU.forEach((h, j) => {
    const d = T - h; if (d < 0 || d > 1.6) return;
    for (const p of CONF[j]) {
      const x = p.x + p.vx * d, y = H + 40 - p.vy * d + 0.5 * 3000 * d * d;
      ctx.save(); ctx.translate(x, y); ctx.rotate(p.a + p.va * d); rr(-p.s / 2, -p.s / 2, p.s, p.s, 4); ctx.fillStyle = p.col; ctx.fill(); ctx.restore();
    }
  });
  if (T - S.code < MDS + 0.02) { morph(T); return; }
  // Up on the up move, held while the thumb would be up, down with a little squash on the down move.
  const up = T >= CD[0] + 0.1 ? thumbUp(T, 0.2, easeOut) : 0, dd = since(T, CD), sq = dd < 0.22 ? 1 - 0.05 * Math.sin((dd / 0.22) * Math.PI) : 1;
  ctx.save(); ctx.translate(0, -40 * up); ctx.translate(W / 2, BASE); ctx.scale(1 / sq, sq); ctx.translate(-W / 2, -BASE);
  ctx.drawImage(ENDS[3].render(1, 1, T - S.morph), 0, 0);
  ctx.restore();
}


// ---- the frame ----
window.frame = (T) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (T < S.montage) { background(T, SKY); title(); reelThumb(T); ring(); return; }
  // One zoom punch, when the code lands for good.
  const d = T - S.code - MDS, z = d >= 0 && d < 0.8 ? 1 + 0.05 * Math.exp(-d * 6) * Math.min(1, d / 0.05) : 1;
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  background(T);
  if (T < S.morph) montage(T); else if (T < S.code) morph(T); else code(T);
};
await document.fonts.load("900 100px 'Inter Display'");
document.title = 'ready';
</script>
