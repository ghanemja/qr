<!-- "Slide your thumb up! Feel the beat": the thumb-swipe trend, QR Compass edition (9:16).
     Cut to the original reel's song (about 147.6 bpm; it cuts every two bars, 3.25 s), so every
     thumb move lands on the beat: the thumb flips up and back down like the reel's demo, and
     each up move launches something (the Roadster off its ramp, the SpaceX booster, a rocket
     off its pad, slices of a 3D world fired up into a real QR code) while each down move brings
     it back down (the car lands, the booster lands, the world recoils, the code thumps down). No captions after the opening card.
     window.frame(seconds) draws any moment; render.cjs captures it. -->
<meta charset="utf-8">
<title>loading</title>
<style>html, body { margin: 0; background: #f6f1e7; overflow: hidden; } canvas { display: block; }</style>
<script type="importmap">{"imports":{"three":"/qr/assets/three.module.min.js"}}</script>
<script src="/qr/assets/qrcode.js"></script>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { world } from './model.js';
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const INK = '#17202c', CREAM = '#f6f1e7', ORANGE = '#e07a3f';
const URL_ = 'https://ghanemja.github.io/qr/';

// ---- the song's grid: beat k falls at -0.04 + 0.4065 k (measured from the reel's audio) ----
const BEAT = 0.4065, K = (k) => -0.04 + BEAT * k;
// Sections, two bars each, as the reel cuts them.
const S = { intro: 0, roadster: K(8) + 0.04, rockets: K(16) + 0.04, build: K(24) + 0.04, code: K(32) + 0.04 };
window.DURATION = +(BEAT * 40).toFixed(3); // 10 bars, so it loops like the reel
// The thumb, as the reel's demo moves it: it flips up on every other beat and back down on the
// beat after, so there are 20 up-and-down cycles, four per section. Up moves launch things;
// down moves bring them back (or land them).
const UP = (n) => K(2 * n) + 0.08, DN = (n) => K(2 * n + 1) + 0.15;
const UPS = Array.from({ length: 20 }, (_, n) => UP(n)), DNS = Array.from({ length: 20 }, (_, n) => DN(n));
const ups = (s) => UPS.slice(4 * s, 4 * s + 4), dns = (s) => DNS.slice(4 * s, 4 * s + 4);
// How far the thumb is up (0 down, 1 up) at time T: a quick flip (0.08 s), then a hold.
function thumbUp(T, dur = 0.09, curve = back) {
  let lastU = -Infinity, lastD = -Infinity;
  for (const u of UPS) if (T >= u) lastU = u;
  for (const d of DNS) if (T >= d) lastD = d;
  if (lastU > lastD) return curve((T - lastU) / dur);
  if (lastD === -Infinity) return 0;
  return 1 - curve((T - lastD) / dur);
}
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeOut = (x) => 1 - (1 - clamp(x)) ** 3;
const easeIn = (x) => clamp(x) ** 3;
function back(x) { x = clamp(x); const s = 1.9; return 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2; }
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (seed) => () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
// Piecewise-linear map through [x, y] keys (for driving a model's clock off the beat).
const pw = (x, keys) => { if (x <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) if (x <= keys[i][0]) { const [a, b] = keys[i - 1], [c, d] = keys[i]; return b + ((x - a) / (c - a)) * (d - b); } return keys[keys.length - 1][1]; };
// How long since the latest of these hits (Infinity before the first).
const since = (T, hits) => { let d = Infinity; for (const h of hits) if (T >= h) d = T - h; return d; };

// ---- the QR code ----
const q = qrcode(0, 'H'); q.addData(URL_); q.make();
const N = q.getModuleCount(), MOD = 22, QX = Math.round(W / 2 - (N * MOD) / 2), QY = 470;
const DARK = [];
for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (q.isDark(r, c)) DARK.push({ r, c, x: QX + (c + 0.5) * MOD, y: QY + (r + 0.5) * MOD });

// ---- drawing helpers ----
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function line(segs, y, size, T, t0 = -1, { weight = 900, stroke = 14 } = {}) {
  const k = T - t0; if (k < 0) return;
  const s = t0 < 0 ? 1 : lerp(0.55, 1, back(k / 0.22));
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(s, s);
  ctx.font = `${weight} ${size}px 'Inter Display', Inter`; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  const widths = segs.map(([t]) => ctx.measureText(t).width), total = widths.reduce((a, b) => a + b, 0);
  let x = -total / 2;
  segs.forEach(([t, col], i) => {
    if (stroke) { ctx.strokeStyle = CREAM; ctx.lineWidth = stroke; ctx.strokeText(t, x, 0); }
    ctx.fillStyle = col || INK; ctx.fillText(t, x, 0); x += widths[i];
  });
  ctx.restore();
}
// The reel's thumb: it comes in from the right edge and swings about a pivot off screen,
// pointing left when down and straight up along the edge when up. Drawn seen from the nail side.
const PIV = { x: 1130, y: 1330 }, TL = 780;
function thumb(up) {
  const ang = lerp(Math.PI + 0.2, -Math.PI / 2 - 0.12, up); // the direction from the pivot to the tip
  ctx.save(); ctx.translate(PIV.x + Math.cos(ang) * TL, PIV.y + Math.sin(ang) * TL); ctx.rotate(ang + Math.PI);
  const w = 190, L = 1500;
  ctx.beginPath(); ctx.moveTo(w / 2, -w / 2); ctx.arc(w / 2, 0, w / 2, -Math.PI / 2, Math.PI / 2, true);
  ctx.bezierCurveTo(280, w / 2 + 6, 460, w / 2 + 30, L, w / 2 + 70); ctx.lineTo(L, -w / 2 - 60);
  ctx.bezierCurveTo(460, -w / 2 - 22, 280, -w / 2 - 4, w / 2, -w / 2); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 9; ctx.strokeStyle = INK; ctx.stroke();
  rr(20, -58, 104, 116, [50, 24, 24, 50]); ctx.fillStyle = '#f2f2f4'; ctx.fill(); ctx.lineWidth = 7; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(246, -48); ctx.quadraticCurveTo(258, 0, 246, 48); ctx.moveTo(272, -32); ctx.quadraticCurveTo(282, 0, 272, 32);
  ctx.lineWidth = 7; ctx.stroke();
  ctx.restore();
}
// Speed lines rushing up after a launch, so every swipe feels like it threw something.
function streaks(T, hits, seed, col = 'rgba(23,32,44,0.18)') {
  const d = since(T, hits); if (d > 0.45) return;
  const R = rand(seed + hits.findIndex((h) => Math.abs(T - d - h) < 1e-6) * 7 + 1);
  ctx.save(); ctx.strokeStyle = col; ctx.lineCap = 'round';
  for (let i = 0; i < 16; i++) {
    const x = 60 + R() * (W - 120), len = 160 + R() * 340, y = H + 100 - (d / 0.45) * (H + 600) * (0.7 + R() * 0.6);
    ctx.globalAlpha = 1 - d / 0.45; ctx.lineWidth = 6 + R() * 10;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + len); ctx.stroke();
  }
  ctx.restore();
}
// One zoom punch, when the code lands (a punch on every beat read as a jolt).
function punch(T) { const d = T - S.code; return d >= 0 && d < 0.8 ? 1 + 0.05 * Math.exp(-d * 6) * Math.min(1, d / 0.05) : 1; }

function background(T) {
  ctx.fillStyle = CREAM; ctx.fillRect(-100, -100, W + 200, H + 200);
  const R = rand(3); ctx.fillStyle = 'rgba(23,32,44,0.045)';
  for (let i = 0; i < 70; i++) {
    const x = R() * W, s = 10 + R() * 26, y = ((R() * (H + 200) - T * (40 + R() * 60)) % (H + 200) + H + 200) % (H + 200) - 100;
    rr(x, y, s, s, 4); ctx.fill();
  }
}

// ---- the 3D worlds, each on the song's clock ----
const TESLA = await world('tesla', W, H), SPACEX = await world('spacex', W, H), PAD = await world('relativity-space', W, H), CAFE = await world('starbucks', W, H);
// The Roadster, one jump per thumb cycle, each from a new angle: the cut comes just before
// the up move, the up move throws it off the curl, and it lands on the down move. Its own
// clock: in the curl from 1.6 s, off it at 2.2 s, down on its wheels at 3.6 s.
const RU = ups(1), RD = dns(1);
const ROAD_CUTS = [S.roadster, RU[1] - 0.14, RU[2] - 0.14, RU[3] - 0.14, S.rockets];
const ROAD_VIEWS = [
  { az: -Math.PI / 4 + 0.1, elev: 0.32, dist: 19 }, { az: -Math.PI / 2 - 0.35, elev: 0.22, dist: 17 },
  { az: -0.15, elev: 0.42, dist: 21 }, { az: -Math.PI / 4 - 0.7, elev: 0.14, dist: 16 }];
const roadCut = (T) => Math.max(0, ROAD_CUTS.findIndex((c, i) => T >= c && T < ROAD_CUTS[i + 1]));
// One steady clock per shot (no speed jumps): off the curl (2.2 s) on the up move, down on its
// wheels (3.6 s) on the down move.
const ROAD_RATE = 1.4 / (RD[0] - RU[0]);
const roadT = (T) => 2.2 + (T - RU[roadCut(T)]) * ROAD_RATE;
const roadView = (T) => { const j = roadCut(T), v = ROAD_VIEWS[j]; return { pin: [-0.1, 1.6, 3.35], at: [W / 2, 1060], ...v, az: v.az + 0.12 * (T - ROAD_CUTS[j]) }; };
// The SpaceX booster bounces off its droneship with the thumb: it lights and leaves the deck on
// the up move, tops out on the down move and settles back onto the pad on the next up move.
// We fly it ourselves (a smooth arc) rather than speeding its own clock up and down; the scene
// is posed at a moment when the legs are out and the deck is clear.
const BU = ups(2), BD = dns(2), PAD_CUT = BU[3] - 0.14, HOP = 4.2;
function boostAlt(T) {
  for (let j = 0; j < 4; j++) {
    const u = BU[j], d = BD[j], u2 = j < 3 ? BU[j + 1] : u + (BU[1] - BU[0]);
    if (T >= u && T < d) { const x = (T - u) / (d - u); return HOP * (1 - (1 - x) ** 2); }            // decelerating climb
    if (T >= d && T < u2) { const x = (T - d) / (u2 - d); return HOP * (1 - x * x); }                 // accelerating fall
  }
  return 0;
}
const boostAfter = (T) => (nodes) => {
  // Everything past the booster's own parts (the boat, the gulls, the Starship on its island) runs
  // on a gentle clock that keeps the Starship sitting on its pad.
  for (let i = 20; i < nodes.length; i++) {
    const { o, mv } = nodes[i], q = mv.anim(1 + (T - S.rockets));
    o.position.set(mv.pivot[0] + (q.x || 0), mv.pivot[1] + (q.y || 0), mv.pivot[2] + (q.z || 0));
    if (q.q) o.quaternion.copy(q.q); else o.rotation.set(q.rx || 0, q.ry || 0, q.rz || 0);
    const s0 = q.s ?? 1, sx = q.sx ?? s0, sy = q.sy ?? s0, sz = q.sz ?? s0;
    o.scale.set(Math.max(1e-3, sx), Math.max(1e-3, sy), Math.max(1e-3, sz)); o.visible = Math.min(sx, sy, sz) > 2e-3;
  }
  const alt = boostAlt(T), body = nodes[0].o;
  body.position.y += alt;
  body.rotation.z = Math.sin(T * 6) * 0.02 * (alt / HOP); body.rotation.x = Math.cos(T * 5) * 0.015 * (alt / HOP);
  // The flame burns on the climb and for the landing burn.
  const dU = since(T, BU), dD = since(T, BD), burning = (dU < dD && alt > 0) || (dD < dU && alt > 0 && alt < 1.6);
  const flame = nodes[9].o; flame.visible = burning;
  if (burning) flame.scale.set(1 + Math.sin(T * 29) * 0.06, 0.9 + Math.sin(T * 37) * 0.12 + (dU < dD ? 0.35 : 0), 1 + Math.sin(T * 31) * 0.06);
  // A puff of smoke across the deck at each lift-off, spreading and fading.
  const p = since(T, BU);
  for (let i = 10; i < 20; i++) {
    const mv = nodes[i].mv, k = p > 1.2 ? 0 : p < 0.15 ? easeOut(p / 0.15) : 1 - ease((p - 0.15) / 0.6);
    const f = k >= 1 ? 0.8 : p < 0.15 ? 0.72 + 0.08 * k : 0.84 + 0.11 * (1 - k); // read the puff's own pose at that spread
    const q = mv.anim(f * 10), o = nodes[i].o;
    o.position.set(mv.pivot[0] + (q.x || 0), mv.pivot[1] + (q.y || 0), mv.pivot[2] + (q.z || 0));
    const sc = Math.max(1e-3, q.s ?? 1); o.scale.set(sc, sc, sc); o.visible = sc > 2e-3;
  }
};
// Its scene is held at 6.0 s on its own clock (booster down, legs out) apart from what we fly.
const boostT = () => 6.0;
const boostView = (T) => ({ pin: [0, 4.2, 0], at: [W / 2, 1250], az: Math.PI / 4 + 0.1 + 0.08 * (T - S.rockets), elev: 0.2, dist: 31, after: boostAfter(T) });
// Then the pad rocket lights on the fourth up move and climbs out of the top of the frame, on a
// steady clock (ignition at 8.64 s; gone by 11.7 s).
const PAD_RATE = (11.7 - 8.64) / (S.build - BU[3]);
const padT = (T) => 8.64 + (T - BU[3]) * PAD_RATE;
const padView = (T) => ({ pin: [-3, 3.2, -3], at: [W / 2, 1300], az: Math.PI / 4 + 0.2 - 0.1 * (T - PAD_CUT), elev: 0.12, dist: 21 });

// ---- the build: the café world pops up on the first up move, lands on the down, and the
// next three up moves fire it, a slice at a time, up into its QR code; it recoils on each down ----
const WU = ups(3), WD = dns(3), B = WU.slice(1), CAFE_AT = { x: W / 2, y: 1440 };
const recoil = (T) => { const d = since(T, WD); return d < 0.25 ? 1 - 0.14 * Math.sin((d / 0.25) * Math.PI) : 1; };
const cafeView = (T) => ({ pin: [0, 0.6, 0], at: [CAFE_AT.x, CAFE_AT.y], az: Math.PI / 4 - 0.3 + 0.3 * clamp((T - WU[0]) / 0.6), elev: 0.62, dist: 50,
  lift: T < WD[0] ? lerp(-16, 0, back((T - WU[0]) / (WD[0] - WU[0]))) : 0, squash: recoil(T) });
const BUILD = (() => {
  const T0 = B[0], img = CAFE.render(2 + T0 - S.build, { ...cafeView(T0), squash: 1 });
  const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H; const tc = tmp.getContext('2d');
  tc.drawImage(img, 0, 0); const data = tc.getImageData(0, 0, W, H).data;
  // Opaque spots of the world on a grid fine enough to give every dark square one.
  let step = 26, src;
  do { src = []; for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) { const i = (y * W + x) * 4; if (data[i + 3] > 200) src.push({ x, y, col: [data[i], data[i + 1], data[i + 2]] }); } step -= 1; } while (src.length < DARK.length);
  // Keep an even spread of them, top to bottom, and split both into one band per hit: the
  // world's top slice flies to the code's top rows first.
  const keep = Array.from({ length: DARK.length }, (_, i) => src[Math.floor((i * src.length) / DARK.length)]).sort((a, b) => a.y - b.y || a.x - b.x);
  const mods = [...DARK].sort((a, b) => a.r - b.r || a.c - b.c), n = B.length, per = Math.ceil(DARK.length / n), R = rand(17);
  const ps = [], cuts = [];
  for (let b = 0; b < n; b++) {
    const s = keep.slice(b * per, (b + 1) * per).sort((a, b) => a.x - b.x), m = mods.slice(b * per, (b + 1) * per).sort((a, b) => a.c - b.c || a.r - b.r);
    s.forEach((p, i) => ps.push({ s: p, d: m[i], band: b, delay: R() * 0.08, arc: 80 + R() * 220, spin: (R() - 0.5) * 9, size: step + 1 }));
    cuts.push(s.length ? Math.max(...s.map((p) => p.y)) + step / 2 : 0);
  }
  return { img: tmp, ps, cuts };
})();
function build(T) {
  // The world: live until the first hit, then the still of it, sliced away from the top.
  if (T < B[0]) ctx.drawImage(CAFE.render(2 + T - S.build, cafeView(T)), 0, 0);
  else {
    const done = B.filter((h) => T >= h).length, cut = done ? BUILD.cuts[done - 1] : 0;
    if (done < B.length) {
      const k = recoil(T), base = CAFE_AT.y + 260; // squash the still toward its bottom on each down move
      ctx.save(); ctx.beginPath(); ctx.rect(0, cut, W, H); ctx.clip();
      ctx.translate(W / 2, base); ctx.scale(1 / Math.sqrt(k), k); ctx.translate(-W / 2, -base); ctx.drawImage(BUILD.img, 0, 0); ctx.restore();
    }
  }
  const card = easeOut((T - B[0]) / 0.25);
  if (card > 0) { ctx.save(); ctx.globalAlpha = card; codeCard(); ctx.restore(); }
  for (const p of BUILD.ps) {
    const h = B[p.band] + p.delay, k = (T - h) / 0.34;
    if (k < 0) continue;
    const e = back(k), f = clamp(k);
    const x = lerp(p.s.x, p.d.x, e), y = lerp(p.s.y, p.d.y, e) - p.arc * Math.sin(f * Math.PI) * (1 - f);
    const [r, g, b] = p.s.col, c = (v, w) => Math.round(lerp(v, w, ease((k - 0.5) / 0.5)));
    const s = lerp(p.size, MOD + 0.6, ease(k));
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.spin * (1 - f));
    ctx.fillStyle = `rgb(${c(r, 23)},${c(g, 32)},${c(b, 44)})`; ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.restore();
  }
}
function codeCard() {
  const pad = 2 * MOD;
  rr(QX - pad, QY - pad, N * MOD + 2 * pad, N * MOD + 2 * pad, 26); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
}

// ---- the finished code: it hops on each swipe, and confetti squares fly up behind it ----
const CU = ups(4), CD = dns(4);
const CONF = CU.map((h, j) => { const R = rand(40 + j); return Array.from({ length: 46 }, (_, i) => ({ x: (i % 2 ? 0.1 + R() * 0.25 : 0.65 + R() * 0.25) * W, vx: (R() - 0.5) * 500, vy: 2300 + R() * 900, s: 18 + R() * 22, a: R() * 6, va: (R() - 0.5) * 14, col: ['#17202c', ORANGE, '#2b5aa8', '#3ddc84', '#f2c94c'][i % 5] })); });
function code(T) {
  CU.forEach((h, j) => {
    const d = T - h; if (d < 0 || d > 1.6) return;
    for (const p of CONF[j]) {
      const x = p.x + p.vx * d, y = H + 40 - p.vy * d + 0.5 * 3000 * d * d;
      ctx.save(); ctx.translate(x, y); ctx.rotate(p.a + p.va * d); rr(-p.s / 2, -p.s / 2, p.s, p.s, 4); ctx.fillStyle = p.col; ctx.fill(); ctx.restore();
    }
  });
  // Up on the up move, held while the thumb is up, and down with a little squash on the down move.
  const up = T >= CU[0] ? thumbUp(T, 0.2, easeOut) : 0, dd = since(T, CD), sq = dd < 0.22 ? 1 - 0.05 * Math.sin((dd / 0.22) * Math.PI) : 1;
  const base = QY + N * MOD + 2 * MOD;
  ctx.save(); ctx.translate(0, -40 * up); ctx.translate(W / 2, base); ctx.scale(1 / sq, sq); ctx.translate(-W / 2, -base);
  codeCard();
  ctx.fillStyle = INK;
  for (const m of DARK) ctx.fillRect(QX + m.c * MOD, QY + m.r * MOD, MOD, MOD);
  ctx.restore();
}

// ---- the frame ----
window.frame = (T) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const z = punch(T); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  background(T);

  if (T < S.roadster) {
    line([['SLIDE YOUR THUMB UP!']], 330, 92, T, 0.0);
    line([['FEEL THE '], ['BEAT', ORANGE]], 440, 92, T, 0.2);
    thumb(thumbUp(T));
    return;
  }
  if (T < S.rockets) {
    streaks(T, RU, 5);
    ctx.drawImage(TESLA.render(roadT(T), roadView(T)), 0, 0);
    return;
  }
  if (T < S.build) {
    streaks(T, BU, 9);
    if (T < PAD_CUT) ctx.drawImage(SPACEX.render(boostT(T), boostView(T)), 0, 0);
    else ctx.drawImage(PAD.render(padT(T), padView(T)), 0, 0);
    return;
  }
  if (T < S.code) { streaks(T, WU, 13, 'rgba(23,32,44,0.1)'); build(T); return; }
  code(T);
  // The flash as the code completes.
  const f = 1 - (T - S.code) / 0.35;
  if (f > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(255,255,255,${f})`; ctx.fillRect(0, 0, W, H); }
};
await document.fonts.load("900 100px 'Inter Display'");
document.title = 'ready';
</script>
