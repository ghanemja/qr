<!-- The reel's title, laid over the whole take by title.cjs as a transparent 1080×1920 PNG. It sits
     in the band above the model and its QR code (y 220–420), clear of Instagram's own top bar. -->
<meta charset="utf-8">
<title>Reel title</title>
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; color: #17202c; }
  #t { position: absolute; left: 60px; right: 60px; top: 212px; text-align: center; }
  h1 { margin: 0; font: 800 96px/1 'Inter Display', Inter, sans-serif; letter-spacing: -3.5px; }
  h1 span { color: #e07a3f; }
  p { display: inline-block; margin: 22px 0 0; padding: 14px 30px; border-radius: 999px; background: #17202c; color: #f6f1e7; font: 700 40px/1 Inter, sans-serif; }
  p b { color: #f0a46b; }
</style>
<div id="t">
  <h1>3D model <span>→</span> QR code</h1>
  <p>Comment <b>“LINK”</b> for the site</p>
</div>
