<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#f6f1e7;font:11px sans-serif}#g{display:grid;grid-template-columns:repeat(var(--cols,8),200px);gap:2px}figure{margin:0;text-align:center}img{width:200px;height:200px;display:block}</style>
