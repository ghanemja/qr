<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snoopy's Suppertime</title>
<meta name="description" content="A crayon short: Snoopy is doodled in, rigged and walked home, does his suppertime happy dance and falls asleep on his doghouse.">
<meta name="theme-color" content="#e9e0cf">
<link rel="icon" href="assets/icon.svg">
<script src="assets/analytics.js" data-goatcounter="ghanemja" data-site="qr"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #e9e0cf; overflow: hidden; }
  body { font-family: 'Gochi Hand', 'Comic Sans MS', cursive; color: #2d2b28; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: manipulation; }
  .tag {
    position: fixed; left: 50%; top: max(18px, env(safe-area-inset-top)); transform: translateX(-50%) rotate(-1.5deg);
    background: #2d2b28; color: #f3ead8; padding: 6px 14px 4px; border-radius: 6px; font-size: clamp(18px, 4.6vw, 26px);
    white-space: nowrap; pointer-events: none; transition: opacity .8s; box-shadow: 3px 4px 0 rgba(28,72,82,.35);
  }
  .bar { position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 10px; padding: 0 16px; flex-wrap: wrap; }
  .bar button {
    font: inherit; font-size: 19px; color: #2d2b28; background: #f6efe0; border: 2.5px solid #2d2b28; border-radius: 12px 9px 13px 8px;
    padding: 6px 14px 4px; cursor: pointer; box-shadow: 3px 3px 0 rgba(28,72,82,.45); transform: rotate(-1deg);
  }
  .bar button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(28,72,82,.45); }
  .gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="c" aria-label="Crayon animation: Snoopy is drawn and rigged, then in his backyard at sunset he does his suppertime happy dance, eats and falls asleep on his doghouse"></canvas>
<div class="tag" id="tag">1. doodle snoopy</div>
<div class="bar">
  <button id="bReplay" type="button">&#8634; Replay</button>
</div>
<script src="assets/snoopy.js"></script>
</body>
</html>
